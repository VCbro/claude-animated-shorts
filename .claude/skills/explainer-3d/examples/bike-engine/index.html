<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>How a bike engine works</title>
  <script type="importmap">
    { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
    } }
  </script>
  <style>
    @font-face { font-family: "Mont"; font-weight: 600; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Mont"; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format("woff2"); }
    @font-face { font-family: "Mont"; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format("woff2"); }
    @font-face { font-family: "Baloo"; font-weight: 600; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Baloo"; font-weight: 800; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-800-normal.woff2) format("woff2"); }
    html.lang-hi body, html.lang-hi .label b, html.lang-hi .chip, html.lang-hi #chain div, html.lang-hi #cap, html.lang-hi #title, html.lang-hi #path div { font-family: "Mont", "Baloo", sans-serif; }
    html.lang-hi #cap { font-size: 78px; line-height: 1.25; font-weight: 800; }
    html.lang-hi #title { font-size: 96px; line-height: 1.12; font-weight: 800; }
    html.lang-hi .label b, html.lang-hi .chip, html.lang-hi #chain div, html.lang-hi #path div { font-weight: 800; }
    :root { --y: #ffd23f; --c: #49d6ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Mont", sans-serif; color: #fff; background: #1a2230; }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .labels { position: fixed; inset: 0; }
    .label { padding: 10px 18px 12px; border-radius: 18px; background: rgba(10, 14, 22, .8); box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
    .label b { display: block; font-weight: 900; font-size: 44px; letter-spacing: .02em; text-transform: uppercase; color: var(--y); }
    .label span { display: block; font-weight: 600; font-size: 30px; color: #dfe6ee; }
    .label span:empty { display: none; }
    .leader { fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 3.5; }
    #title { position: fixed; left: 0; right: 0; top: 150px; text-align: center; font-weight: 900; text-transform: uppercase;
      font-size: 90px; line-height: .98; letter-spacing: -.01em; text-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 40px rgba(0,0,0,.45); }
    #title em { font-style: normal; color: var(--y); }
    #cap { position: fixed; left: 60px; right: 60px; top: 1235px; text-align: center; font-weight: 900; text-transform: uppercase;
      font-size: 74px; line-height: 1.08; letter-spacing: -.005em; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
      text-shadow: 0 7px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.55); }
    #cap span { display: inline-block; margin: 0 .14em; transform-origin: 50% 70%; }
    #cap span.on { color: var(--y); }
    .chip { position: fixed; left: 50%; transform: translateX(-50%); padding: 16px 34px 18px; border-radius: 26px; white-space: nowrap;
      font-weight: 900; font-size: 56px; text-transform: uppercase; background: rgba(10, 14, 22, .84); box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
    #bang { top: 520px; font-size: 60px; } #bang b { color: #ffb02e; font-size: 84px; }
    #stroke { top: 300px; }
    #cyc { top: 420px; font-size: 42px; color: #ffd9a8; }
    #dial { position: fixed; right: 40px; top: 110px; width: 200px; height: 200px; }
    #path { position: fixed; left: 0; right: 0; top: 300px; display: flex; justify-content: center; align-items: center; gap: 5px; }
    #path div { font-weight: 900; font-size: 31px; text-transform: uppercase; padding: 9px 13px 11px; border-radius: 18px; background: rgba(10,14,22,.84);
      box-shadow: 0 0 0 3px rgba(255,255,255,.16); }
    #path div.on { color: #10151c; background: var(--y); }
    #path i { font-style: normal; font-size: 26px; color: #b8c4d0; }
    #chain { position: fixed; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #chain div { font-weight: 900; font-size: 64px; text-transform: uppercase; padding: 8px 34px 12px; border-radius: 22px; background: rgba(10,14,22,.82);
      box-shadow: 0 0 0 3px rgba(255,255,255,.16); }
    #chain i { font-style: normal; font-size: 40px; color: #b8c4d0; line-height: .6; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="labels"></div>
  <div id="title">How a<br><em>bike engine</em><br>works</div>
  <div id="bang" class="chip"></div>
  <div id="stroke" class="chip"></div>
  <div id="cyc" class="chip"></div>
  <svg id="dial" viewBox="0 0 200 200"></svg>
  <div id="path"></div>
  <div id="chain"></div>
  <div id="cap"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
