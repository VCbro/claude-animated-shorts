<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Documentary</title>
<style>
  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-600-normal.woff2); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: B; font-weight: 800; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-800-normal.woff2); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2013-2022, U+2190-21FF, U+2248, U+00D7; }
  @font-face { font-family: B; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); unicode-range: U+0000-00FF, U+2013-2022, U+2190-21FF, U+2248, U+00D7; }
  @font-face { font-family: M; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05080f; font-family: B, sans-serif; color: #fff; }
  canvas { position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .t { position: absolute; white-space: nowrap; }
  .lab { padding: 8px 24px 5px; border-radius: 14px; background: rgba(8,12,22,.82); box-shadow: 0 0 0 2px rgba(255,255,255,.16), 0 10px 30px rgba(0,0,0,.35);
         font-weight: 800; font-size: 40px; color: #ffd166; line-height: 1.2; }
  .lab i { display: block; font-style: normal; font-weight: 600; font-size: 26px; color: #d6e2f0; }
  .big { font-family: M, B; font-weight: 900; letter-spacing: -2px; }
  .ttl { font-weight: 800; text-shadow: 0 6px 30px rgba(0,0,0,.6); text-align: center; }
  .chap { font-weight: 800; font-size: 30px; letter-spacing: 1px; color: #7fd8ff; text-transform: uppercase; }
  #cap { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-weight: 800; font-size: 50px; line-height: 1.3;
         text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 20px rgba(0,0,0,.7); }
  #cap .box { display: inline-block; padding: 4px 26px 0; border-radius: 14px; background: rgba(5,8,15,.55); }
  #cap span.on { color: #ffd166; }
  svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }

</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<svg id="lines"></svg>
<div id="ui"></div>
