<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="Poppins, 'Noto Sans', sans-serif">
  <rect width="760" height="210" fill="#ffffff"/>
  <g text-anchor="middle">
    <rect x="10" y="20" width="175" height="170" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="97" y="72" font-size="44" font-weight="700" fill="#1565c0">.</text>
    <text x="97" y="105" font-size="16" font-weight="700" fill="#1565c0">DECLARATIVE</text>
    <text x="97" y="128" font-size="12" fill="#444">tells / gives information</text>
    <text x="97" y="160" font-size="12" font-style="italic">The shop opens at ten.</text>

    <rect x="200" y="20" width="175" height="170" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="287" y="72" font-size="44" font-weight="700" fill="#2e7d32">?</text>
    <text x="287" y="105" font-size="16" font-weight="700" fill="#2e7d32">INTERROGATIVE</text>
    <text x="287" y="128" font-size="12" fill="#444">asks a question</text>
    <text x="287" y="160" font-size="12" font-style="italic">Does it open at ten?</text>

    <rect x="390" y="20" width="175" height="170" rx="16" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="477" y="72" font-size="38" font-weight="700" fill="#e65100">. / !</text>
    <text x="477" y="105" font-size="16" font-weight="700" fill="#e65100">IMPERATIVE</text>
    <text x="477" y="128" font-size="12" fill="#444">order · request · advice</text>
    <text x="477" y="160" font-size="12" font-style="italic">Please open it at ten.</text>

    <rect x="580" y="20" width="170" height="170" rx="16" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="665" y="72" font-size="44" font-weight="700" fill="#ad1457">!</text>
    <text x="665" y="105" font-size="16" font-weight="700" fill="#ad1457">EXCLAMATORY</text>
    <text x="665" y="128" font-size="12" fill="#444">strong feeling</text>
    <text x="665" y="160" font-size="12" font-style="italic">What a big shop!</text>
  </g>
</svg>
