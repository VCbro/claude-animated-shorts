<text x="50" y="472" font-size="16"><tspan font-weight="bold" fill="#bf360c">અંતઃસ્થ (અર્ધસ્વર):</tspan> <tspan fill="#263238">ય (તાલવ્ય), ર (મૂર્ધન્ય), લ (દંત્ય), વ (દંતોષ્ઠ્ય)</tspan></text>
<text x="50" y="505" font-size="16"><tspan font-weight="bold" fill="#bf360c">ઊષ્માક્ષર (સંઘર્ષી):</tspan> <tspan fill="#263238">શ (તાલવ્ય), ષ (મૂર્ધન્ય), સ (દંત્ય), હ (કંઠ્ય – ઘોષ મહાપ્રાણ)</tspan></text>
<text x="50" y="538" font-size="16"><tspan font-weight="bold" fill="#bf360c">વિશિષ્ટ:</tspan> <tspan fill="#263238">ળ (મૂર્ધન્ય) · સંયુક્ત વ્યંજન – ક્ષ (ક્ + ષ), જ્ઞ (જ્ + ઞ)</tspan></text>
<text x="50" y="571" font-size="16"><tspan font-weight="bold" fill="#bf360c">યાદ રાખો:</tspan> <tspan fill="#263238">દરેક વર્ગના પહેલા બે – અઘોષ; છેલ્લા ત્રણ – ઘોષ; 2જા અને 4થા – મહાપ્રાણ</tspan></text>
<text x="50" y="604" font-size="16"><tspan font-weight="bold" fill="#bf360c">કુલ:</tspan> <tspan fill="#263238">ગુજરાતીમાં સામાન્ય રીતે 34 વ્યંજન + 2 સંયુક્ત (ક્ષ, જ્ઞ); સ્વર – અ થી ઔ</tspan></text>
