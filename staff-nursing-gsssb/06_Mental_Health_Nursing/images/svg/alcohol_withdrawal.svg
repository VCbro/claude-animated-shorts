<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#c5e1a5"/><stop offset=".4" stop-color="#ffee58"/><stop offset=".7" stop-color="#ff9800"/><stop offset="1" stop-color="#c62828"/></linearGradient>
    <radialGradient id="b" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#90caf9"/><stop offset="1" stop-color="#0d47a1"/></radialGradient>
    <linearGradient id="bt" x1="0" x2="1"><stop offset="0" stop-color="#795548"/><stop offset=".5" stop-color="#bcaaa4"/><stop offset="1" stop-color="#4e342e"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="420" fill="#fbfdff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">Alcohol Withdrawal – Timeline after Last Drink</text>
  <g filter="url(#s)"><rect x="60" y="70" width="780" height="24" rx="12" fill="url(#t)"/></g>
  <g filter="url(#s)">
    <circle cx="120" cy="82" r="20" fill="url(#b)"/><circle cx="330" cy="82" r="20" fill="url(#b)"/><circle cx="560" cy="82" r="20" fill="url(#b)"/><circle cx="780" cy="82" r="20" fill="url(#b)"/>
  </g>
  <g font-weight="bold" font-size="12.5" text-anchor="middle" fill="#0d47a1">
    <text x="120" y="58">6–12 hrs</text><text x="330" y="58">12–48 hrs</text><text x="560" y="58">12–48 hrs</text><text x="780" y="58">48–96 hrs</text>
  </g>
  <g filter="url(#s)">
    <rect x="25" y="120" width="190" height="170" rx="12" fill="#f1f8e9" stroke="#9ccc65" stroke-width="2"/>
    <rect x="235" y="120" width="190" height="170" rx="12" fill="#fffde7" stroke="#fdd835" stroke-width="2"/>
    <rect x="445" y="120" width="210" height="170" rx="12" fill="#fff3e0" stroke="#ffa726" stroke-width="2"/>
    <rect x="675" y="120" width="185" height="170" rx="12" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  </g>
  <g font-size="11.5">
    <text x="120" y="144" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#33691e">Minor withdrawal</text>
    <text x="37" y="168">Tremors ("shakes")</text><text x="37" y="186">Anxiety, insomnia</text><text x="37" y="204">Sweating, nausea</text><text x="37" y="222">Tachycardia, ↑ BP</text><text x="37" y="240">Craving</text>
    <text x="330" y="144" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#f57f17">Withdrawal seizures</text>
    <text x="247" y="168">"Rum fits"</text><text x="247" y="186">Generalised tonic-</text><text x="247" y="204">clonic, usually single</text><text x="247" y="222">or few</text><text x="247" y="246" font-weight="bold">Rx: benzodiazepine</text>
    <text x="550" y="144" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#e65100">Alcoholic hallucinosis</text>
    <text x="457" y="168">Auditory hallucinations</text><text x="457" y="186">(mostly) with CLEAR</text><text x="457" y="204">consciousness</text><text x="457" y="222">Oriented; not delirious</text>
    <text x="767" y="144" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#b71c1c">Delirium tremens</text>
    <text x="687" y="168">Confusion, disorientation</text><text x="687" y="186">Vivid VISUAL (Lilliputian)</text><text x="687" y="204">hallucinations, tremors</text><text x="687" y="222">Fever, autonomic storm</text><text x="687" y="240" font-weight="bold" fill="#b71c1c">Medical emergency</text><text x="687" y="258" fill="#b71c1c">(can be fatal)</text>
  </g>
  <g filter="url(#s)"><rect x="25" y="305" width="835" height="100" rx="12" fill="#fff" stroke="#90caf9" stroke-width="2"/></g>
  <g font-size="12">
    <text x="40" y="330"><tspan font-weight="bold" fill="#0d47a1">Detox Rx:</tspan> long-acting benzodiazepine – <tspan font-weight="bold">chlordiazepoxide/ diazepam</tspan> (lorazepam if liver disease) · CIWA-Ar scale</text>
    <text x="40" y="352"><tspan font-weight="bold" fill="#c62828">Thiamine BEFORE glucose</tspan> – prevents <tspan font-weight="bold">Wernicke's encephalopathy</tspan> (confusion, ataxia, ophthalmoplegia)</text>
    <text x="40" y="374"><tspan font-weight="bold" fill="#0d47a1">Korsakoff psychosis:</tspan> recent memory loss + <tspan font-weight="bold">confabulation</tspan> (often irreversible)</text>
    <text x="40" y="396"><tspan font-weight="bold" fill="#0d47a1">Relapse prevention:</tspan> disulfiram (aversion), naltrexone, acamprosate · AA groups · CAGE screening</text>
  </g>
</svg>
