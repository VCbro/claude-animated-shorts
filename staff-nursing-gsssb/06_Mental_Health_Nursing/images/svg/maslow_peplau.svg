<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="m1" x1="0" x2="1"><stop offset="0" stop-color="#6a1b9a"/><stop offset=".5" stop-color="#ab47bc"/><stop offset="1" stop-color="#4a148c"/></linearGradient>
    <linearGradient id="m2" x1="0" x2="1"><stop offset="0" stop-color="#1565c0"/><stop offset=".5" stop-color="#42a5f5"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="m3" x1="0" x2="1"><stop offset="0" stop-color="#00838f"/><stop offset=".5" stop-color="#26c6da"/><stop offset="1" stop-color="#006064"/></linearGradient>
    <linearGradient id="m4" x1="0" x2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset=".5" stop-color="#66bb6a"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
    <linearGradient id="m5" x1="0" x2="1"><stop offset="0" stop-color="#e65100"/><stop offset=".5" stop-color="#ffa726"/><stop offset="1" stop-color="#bf360c"/></linearGradient>
    <radialGradient id="p" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f48fb1"/><stop offset="1" stop-color="#ad1457"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="440" fill="#fcfbff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a148c">Maslow's Hierarchy of Needs &amp; Peplau's Nurse–Patient Relationship</text>
  <g filter="url(#s)">
    <path d="M210 50 L265 120 L155 120 Z" fill="url(#m1)"/>
    <path d="M150 126 L270 126 L320 190 L100 190 Z" fill="url(#m2)"/>
    <path d="M95 196 L325 196 L375 260 L45 260 Z" fill="url(#m3)"/>
    <path d="M40 266 L380 266 L420 330 L0 330 Z" fill="url(#m4)" transform="translate(10,0) scale(.98,1)"/>
    <path d="M10 336 L410 336 L440 400 L-20 400 Z" fill="url(#m5)" transform="translate(25,0) scale(.95,1)"/>
  </g>
  <g fill="#fff" font-weight="bold" text-anchor="middle" font-size="12">
    <text x="210" y="110" font-size="10">Self-</text><text x="210" y="118" font-size="8">actualisation</text>
    <text x="210" y="163">Esteem</text>
    <text x="210" y="233">Love &amp; belonging</text>
    <text x="215" y="303">Safety &amp; security</text>
    <text x="215" y="373">Physiological (air, food, water, sleep)</text>
  </g>
  <text x="210" y="425" text-anchor="middle" font-size="11.5" fill="#455a64">Lower needs first – priority: physiological → safety</text>
  <!-- Peplau -->
  <g filter="url(#s)"><rect x="460" y="50" width="400" height="370" rx="14" fill="#fff" stroke="#f8bbd0" stroke-width="2"/></g>
  <text x="660" y="76" text-anchor="middle" font-weight="bold" font-size="14.5" fill="#ad1457">Peplau (1952) – Interpersonal Theory</text>
  <g filter="url(#s)">
    <circle cx="500" cy="120" r="24" fill="url(#p)"/><circle cx="500" cy="200" r="24" fill="url(#p)"/>
    <circle cx="500" cy="280" r="24" fill="url(#p)"/><circle cx="500" cy="360" r="24" fill="url(#p)"/>
  </g>
  <path d="M500 144 V176 M500 224 V256 M500 304 V336" stroke="#ad1457" stroke-width="3"/>
  <g font-weight="bold" fill="#fff" text-anchor="middle" font-size="16"><text x="500" y="126">1</text><text x="500" y="206">2</text><text x="500" y="286">3</text><text x="500" y="366">4</text></g>
  <g font-size="12">
    <text x="535" y="114" font-weight="bold" fill="#880e4f">Orientation (pre-interaction +)</text>
    <text x="535" y="132">Meet, build trust, contract, confidentiality</text>
    <text x="535" y="194" font-weight="bold" fill="#880e4f">Identification</text>
    <text x="535" y="212">Patient identifies with nurse; problems explored</text>
    <text x="535" y="274" font-weight="bold" fill="#880e4f">Exploitation (Working)</text>
    <text x="535" y="292">Uses services fully; behaviour change, coping</text>
    <text x="535" y="354" font-weight="bold" fill="#880e4f">Resolution (Termination)</text>
    <text x="535" y="372">Goals met; independence; plan ending early</text>
    <text x="475" y="398" font-size="10.5" fill="#455a64">Nurse roles: stranger, resource person, teacher,</text><text x="475" y="413" font-size="10.5" fill="#455a64">counsellor, surrogate, leader</text>
  </g>
</svg>
