<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbf8ff"/><stop offset="1" stop-color="#ede7f6"/></linearGradient>
    <radialGradient id="g1" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#e3f2fd"/><stop offset=".6" stop-color="#42a5f5"/><stop offset="1" stop-color="#0d47a1"/></radialGradient>
    <radialGradient id="g2" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#e8f5e9"/><stop offset=".6" stop-color="#66bb6a"/><stop offset="1" stop-color="#1b5e20"/></radialGradient>
    <radialGradient id="g3" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#fff8e1"/><stop offset=".6" stop-color="#ffca28"/><stop offset="1" stop-color="#e65100"/></radialGradient>
    <radialGradient id="g4" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#fce4ec"/><stop offset=".6" stop-color="#ec407a"/><stop offset="1" stop-color="#880e4f"/></radialGradient>
    <radialGradient id="g5" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#ede7f6"/><stop offset=".6" stop-color="#9575cd"/><stop offset="1" stop-color="#311b92"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#4527a0">Brain Lobes &amp; Neuron</text>
  <g filter="url(#s)">
    <path d="M70 250 C60 150 130 90 210 90 L230 90 L240 250 Z" fill="url(#g1)"/>
    <path d="M230 90 C300 85 340 100 360 130 L330 230 L240 250 Z" fill="url(#g2)"/>
    <path d="M360 130 C400 170 410 230 390 280 L330 230 Z" fill="url(#g4)"/>
    <path d="M70 250 L240 250 L330 230 L390 280 C360 320 280 320 200 315 C130 310 80 290 70 250 Z" fill="url(#g3)"/>
    <ellipse cx="330" cy="345" rx="60" ry="35" fill="url(#g5)"/>
    <rect x="245" y="300" width="34" height="110" rx="14" fill="#a1887f"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="155" y="175">Frontal</text><text x="290" y="160">Parietal</text><text x="368" y="225">Occ.</text>
    <text x="200" y="285" fill="#4e342e">Temporal</text><text x="335" y="350">Cerebellum</text>
  </g>
  <text x="262" y="435" text-anchor="middle" font-size="13" fill="#4e342e">Brainstem (midbrain, pons, medulla)</text>
  <g font-size="12.5" fill="#263238">
    <text x="40" y="470">Frontal – personality, motor (Broca's speech area)</text>
    <text x="40" y="490">Parietal – sensation · Occipital – vision</text>
    <text x="40" y="510">Temporal – hearing, memory (Wernicke's) · Cerebellum – balance</text>
    <text x="40" y="530">Medulla – vital centres (respiration, cardiac, vasomotor)</text>
  </g>
  <rect x="500" y="70" width="380" height="465" rx="16" fill="#fff" stroke="#b39ddb" stroke-width="2"/>
  <text x="690" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#4527a0">Neuron (structural &amp; functional unit)</text>
  <g filter="url(#s)">
    <circle cx="570" cy="190" r="34" fill="url(#g5)"/>
    <circle cx="570" cy="190" r="11" fill="#311b92"/>
    <path d="M545 170 L515 140 M548 210 L515 240 M560 160 L555 125 M590 165 L610 135" stroke="#7e57c2" stroke-width="5" stroke-linecap="round"/>
    <path d="M604 190 L820 190" stroke="#7e57c2" stroke-width="6"/>
    <g fill="#ffca28" stroke="#f57f17"><rect x="625" y="180" width="40" height="20" rx="10"/><rect x="680" y="180" width="40" height="20" rx="10"/><rect x="735" y="180" width="40" height="20" rx="10"/></g>
    <path d="M820 190 L850 165 M820 190 L855 190 M820 190 L850 215" stroke="#7e57c2" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-size="12.5" fill="#263238">
    <text x="500" y="270" dx="15">Dendrites → impulse TOWARDS cell body</text>
    <text x="515" y="292">Axon → impulse AWAY from cell body</text>
    <text x="515" y="314">Myelin sheath (Schwann cells – PNS,</text>
    <text x="527" y="332">oligodendrocytes – CNS) → saltatory</text>
    <text x="527" y="350">conduction via nodes of Ranvier</text>
    <text x="515" y="374">Synapse – neurotransmitter (ACh, etc.)</text>
    <text x="515" y="398">Resting potential ≈ −70 mV</text>
    <text x="515" y="422">Neurons don't divide (no centrioles)</text>
    <text x="515" y="446">CSF ≈ 150 ml, ~500 ml/day (choroid plexus)</text>
    <text x="515" y="470">12 pairs cranial · 31 pairs spinal nerves</text>
    <text x="515" y="494">Spinal cord ends at L1–L2 (adult)</text>
    <text x="515" y="518">Brain weight ≈ 1.3–1.4 kg</text>
  </g>
</svg>
