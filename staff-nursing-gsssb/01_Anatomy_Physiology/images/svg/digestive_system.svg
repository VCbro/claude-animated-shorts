<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfff7"/><stop offset="1" stop-color="#f1f8e9"/></linearGradient>
    <radialGradient id="liv" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#d7ccc8"/><stop offset=".55" stop-color="#8d6e63"/><stop offset="1" stop-color="#3e2723"/></radialGradient>
    <radialGradient id="sto" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#fce4ec"/><stop offset=".55" stop-color="#f06292"/><stop offset="1" stop-color="#880e4f"/></radialGradient>
    <radialGradient id="gb" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#f1f8e9"/><stop offset=".55" stop-color="#9ccc65"/><stop offset="1" stop-color="#33691e"/></radialGradient>
    <radialGradient id="pan" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#fff8e1"/><stop offset=".55" stop-color="#ffca28"/><stop offset="1" stop-color="#ff6f00"/></radialGradient>
    <linearGradient id="int" x1="0" x2="1"><stop offset="0" stop-color="#ffab91"/><stop offset=".5" stop-color="#ffccbc"/><stop offset="1" stop-color="#e64a19"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#33691e">Digestive System – Organs &amp; Functions</text>
  <g filter="url(#s)">
    <rect x="245" y="60" width="18" height="120" rx="8" fill="#ef9a9a"/>
    <path d="M110 190 C120 150 230 140 270 180 C280 230 230 260 160 250 C120 245 105 220 110 190 Z" fill="url(#liv)"/>
    <ellipse cx="200" cy="262" rx="20" ry="13" fill="url(#gb)"/>
    <path d="M265 175 C320 160 360 200 350 245 C340 290 290 290 275 260 C265 240 250 220 265 175 Z" fill="url(#sto)"/>
    <path d="M230 285 C270 300 330 300 360 285" stroke="url(#pan)" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M130 470 L130 320 C130 300 145 300 160 300 L360 300 C375 300 385 310 385 325 L385 470" stroke="url(#int)" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M180 340 C220 320 240 360 280 340 C320 320 340 370 300 390 C260 410 220 380 190 410 C170 430 220 450 260 440" stroke="#ffab91" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#263238">
    <text x="272" y="85">Oesophagus (25 cm)</text>
    <text x="60" y="160" fill="#3e2723">Liver (largest gland)</text>
    <text x="140" y="292" font-size="12" fill="#33691e">Gall bladder</text>
    <text x="330" y="175" fill="#880e4f">Stomach</text>
    <text x="372" y="296" font-size="12" fill="#e65100">Pancreas</text>
    <text x="210" y="475" font-size="12" fill="#bf360c">Small intestine (~6 m)</text>
    <text x="385" y="515" text-anchor="middle" fill="#bf360c">Large intestine (1.5 m)</text>
    <text x="70" y="495" font-size="12" fill="#bf360c">Caecum + appendix (RIF)</text>
  </g>
  <rect x="480" y="70" width="400" height="465" rx="16" fill="#fff" stroke="#aed581" stroke-width="2"/>
  <g font-size="12.5" fill="#263238">
    <text x="680" y="98" text-anchor="middle" font-weight="bold" fill="#33691e" font-size="16">Digestion at a glance</text>
    <text x="495" y="126"><tspan font-weight="bold">Mouth</tspan> – salivary amylase (ptyalin) – starch</text>
    <text x="495" y="150"><tspan font-weight="bold">Stomach</tspan> – HCl (parietal cells), pepsin</text>
    <text x="507" y="168">(chief cells), intrinsic factor → B12</text>
    <text x="495" y="192"><tspan font-weight="bold">Liver</tspan> – bile (no enzyme) emulsifies fat</text>
    <text x="495" y="216"><tspan font-weight="bold">Pancreas</tspan> – trypsin, lipase, amylase</text>
    <text x="507" y="234">+ bicarbonate; islets – insulin, glucagon</text>
    <text x="495" y="258"><tspan font-weight="bold">Small intestine</tspan> – duodenum, jejunum,</text>
    <text x="507" y="276">ileum; villi – most absorption</text>
    <text x="507" y="294">B12 &amp; bile salts – terminal ileum</text>
    <text x="495" y="318"><tspan font-weight="bold">Large intestine</tspan> – water, electrolytes,</text>
    <text x="507" y="336">vitamin K by gut bacteria</text>
    <text x="495" y="364" font-weight="bold" fill="#33691e">End products</text>
    <text x="495" y="388">Carbohydrate → glucose</text>
    <text x="495" y="410">Protein → amino acids</text>
    <text x="495" y="432">Fat → fatty acids + glycerol</text>
    <text x="495" y="462">Iron absorbed – duodenum</text>
    <text x="495" y="486">Gastric emptying ≈ 2–4 hrs</text>
    <text x="495" y="510">Ampulla of Vater – 2nd part of duodenum</text>
  </g>
</svg>
