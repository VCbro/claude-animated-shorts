<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="t1" x1="0" x2="1"><stop offset="0" stop-color="#4a148c"/><stop offset=".5" stop-color="#9c4dcc"/><stop offset="1" stop-color="#38006b"/></linearGradient>
    <linearGradient id="t2" x1="0" x2="1"><stop offset="0" stop-color="#0d47a1"/><stop offset=".5" stop-color="#5e92f3"/><stop offset="1" stop-color="#002171"/></linearGradient>
    <linearGradient id="t3" x1="0" x2="1"><stop offset="0" stop-color="#00695c"/><stop offset=".5" stop-color="#4db6ac"/><stop offset="1" stop-color="#003d33"/></linearGradient>
    <linearGradient id="t4" x1="0" x2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset=".5" stop-color="#81c784"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
    <linearGradient id="t5" x1="0" x2="1"><stop offset="0" stop-color="#f57f17"/><stop offset=".5" stop-color="#ffd54f"/><stop offset="1" stop-color="#e65100"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="470" fill="#fafcff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">Rural Health Care Delivery in India – Population Norms</text>
  <g filter="url(#s)">
    <path d="M230 50 L290 120 L170 120 Z" fill="url(#t1)"/>
    <path d="M166 126 L294 126 L340 190 L120 190 Z" fill="url(#t2)"/>
    <path d="M116 196 L344 196 L390 260 L70 260 Z" fill="url(#t3)"/>
    <path d="M66 266 L394 266 L440 330 L20 330 Z" fill="url(#t4)"/>
    <path d="M16 336 L444 336 L470 390 L-10 390 Z" fill="url(#t5)" transform="translate(12,0)"/>
  </g>
  <g fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="230" y="110" font-size="11">Tertiary</text>
    <text x="230" y="163" font-size="13">District Hospital</text>
    <text x="230" y="225" font-size="13">CHC (FRU) – 30 beds</text>
    <text x="230" y="295" font-size="13">PHC – AAM (4–6 beds)</text>
    <text x="242" y="368" font-size="13" fill="#3e2723">Sub-Centre – AAM / Village (ASHA, AWW)</text>
  </g>
  <g filter="url(#s)"><rect x="490" y="50" width="370" height="340" rx="14" fill="#fff" stroke="#90caf9" stroke-width="2"/></g>
  <g font-size="12">
    <text x="505" y="76" font-weight="bold" font-size="14" fill="#0d47a1">Population covered (Plain / Hilly-tribal)</text>
    <rect x="505" y="88" width="340" height="1" fill="#bbdefb"/>
    <text x="505" y="112" font-weight="bold" fill="#e65100">Sub-Centre</text><text x="660" y="112">5,000 / 3,000</text>
    <text x="505" y="132" fill="#455a64" font-size="11">ANM + MPW (M) + CHO (at AAM/ HWC)</text>
    <text x="505" y="160" font-weight="bold" fill="#2e7d32">PHC</text><text x="660" y="160">30,000 / 20,000</text>
    <text x="505" y="180" fill="#455a64" font-size="11">Medical officer · 6 SCs · referral to CHC</text>
    <text x="505" y="208" font-weight="bold" fill="#00695c">CHC</text><text x="660" y="208">1,20,000 / 80,000</text>
    <text x="505" y="228" fill="#455a64" font-size="11">4 PHCs · specialists (surgeon, physician,</text>
    <text x="505" y="244" fill="#455a64" font-size="11">OBG, paediatrician) · FRU</text>
    <text x="505" y="272" font-weight="bold" fill="#1565c0">ASHA</text><text x="660" y="272">1 per 1,000</text>
    <text x="505" y="292" fill="#455a64" font-size="11">Woman 25–45 yrs, literate (8th–10th), resident</text>
    <text x="505" y="320" font-weight="bold" fill="#6a1b9a">AAM / HWC</text><text x="660" y="320">Ayushman Bharat (2018)</text>
    <text x="505" y="340" fill="#455a64" font-size="11">SC &amp; PHC upgraded → CPHC 12 service packages</text>
    <text x="505" y="356" fill="#455a64" font-size="11">Renamed Ayushman Arogya Mandir (2023)</text>
    <text x="505" y="378" fill="#455a64" font-size="11">Village Health Sanitation &amp; Nutrition Committee</text>
  </g>
  <g font-size="12" fill="#263238">
    <text x="20" y="420"><tspan font-weight="bold" fill="#0d47a1">Levels of care:</tspan> Primary (SC, PHC) → Secondary (CHC, sub-district &amp; district hospitals) → Tertiary (medical colleges, AIIMS)</text>
    <text x="20" y="444"><tspan font-weight="bold" fill="#0d47a1">Bhore Committee (1946)</tspan> – recommended PHC concept; <tspan font-weight="bold" fill="#0d47a1">Alma-Ata (1978)</tspan> – Primary Health Care, "Health for All"</text>
  </g>
</svg>
