<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="DejaVu Sans, Arial">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#fff3e0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe0b2"/></linearGradient>
    <linearGradient id="roof" x1="0" x2="1"><stop offset="0" stop-color="#bf360c"/><stop offset=".5" stop-color="#ff7043"/><stop offset="1" stop-color="#8d2a06"/></linearGradient>
    <linearGradient id="roof2" x1="0" x2="1"><stop offset="0" stop-color="#1b5e20"/><stop offset=".5" stop-color="#66bb6a"/><stop offset="1" stop-color="#103d13"/></linearGradient>
    <radialGradient id="tree" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c5e1a5"/><stop offset=".6" stop-color="#43a047"/><stop offset="1" stop-color="#1b5e20"/></radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3cf"/><stop offset="1" stop-color="#d0875f"/></radialGradient>
    <linearGradient id="uni" x1="0" x2="1"><stop offset="0" stop-color="#0277bd"/><stop offset=".5" stop-color="#4fc3f7"/><stop offset="1" stop-color="#01579b"/></linearGradient>
    <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#4e342e"/><stop offset=".5" stop-color="#8d6e63"/><stop offset="1" stop-color="#3e2723"/></linearGradient>
    <radialGradient id="cross" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#b71c1c"/></radialGradient>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="5" dy="9" stdDeviation="7" flood-opacity=".33"/></filter>
  </defs>
  <circle cx="300" cy="220" r="205" fill="url(#glow)"/>
  <!-- health centre -->
  <g filter="url(#s)">
    <rect x="300" y="170" width="220" height="140" rx="6" fill="url(#wall)" stroke="#ffab91"/>
    <path d="M285 175 L410 105 L535 175 Z" fill="url(#roof2)"/>
    <rect x="390" y="240" width="40" height="70" rx="4" fill="#795548"/>
    <rect x="325" y="200" width="45" height="35" rx="4" fill="#b3e5fc" stroke="#0288d1"/>
    <rect x="450" y="200" width="45" height="35" rx="4" fill="#b3e5fc" stroke="#0288d1"/>
    <g transform="translate(410,145)"><rect x="-6" y="-18" width="12" height="36" fill="url(#cross)"/><rect x="-18" y="-6" width="36" height="12" fill="url(#cross)"/></g>
  </g>
  <!-- village hut -->
  <g filter="url(#s)">
    <rect x="70" y="230" width="120" height="85" rx="5" fill="url(#wall)" stroke="#ffcc80"/>
    <path d="M55 235 L130 175 L205 235 Z" fill="url(#roof)"/>
    <rect x="115" y="265" width="30" height="50" rx="3" fill="#6d4c41"/>
  </g>
  <!-- tree -->
  <g filter="url(#s)">
    <rect x="230" y="250" width="14" height="70" fill="#6d4c41"/>
    <circle cx="237" cy="230" r="38" fill="url(#tree)"/>
  </g>
  <!-- nurse with bag -->
  <g transform="translate(270,300)" filter="url(#s)">
    <path d="M-22 0 Q0 -10 22 0 L28 80 L-28 80 Z" fill="url(#uni)"/>
    <circle cx="0" cy="-22" r="22" fill="url(#skin)"/>
    <path d="M-22 -28 Q0 -55 22 -28 Q12 -38 0 -36 Q-12 -38 -22 -28 Z" fill="#3e2723"/>
    <path d="M-18 -46 h36 v8 h-36 z" fill="#ffffff" stroke="#90a4ae"/>
    <circle cx="-8" cy="-22" r="2.5" fill="#3e2723"/><circle cx="8" cy="-22" r="2.5" fill="#3e2723"/>
    <path d="M-7 -12 Q0 -7 7 -12" stroke="#bf360c" stroke-width="2" fill="none"/>
    <rect x="22" y="35" width="40" height="30" rx="6" fill="url(#bag)"/>
    <path d="M30 35 q12 -14 24 0" stroke="#3e2723" stroke-width="4" fill="none"/>
    <g transform="translate(42,50)"><rect x="-2.5" y="-8" width="5" height="16" fill="#fff"/><rect x="-8" y="-2.5" width="16" height="5" fill="#fff"/></g>
  </g>
  <!-- family -->
  <g filter="url(#s)">
    <g transform="translate(130,345)"><circle cy="-20" r="14" fill="url(#skin)"/><path d="M-14 -6 Q0 -12 14 -6 L18 40 L-18 40 Z" fill="#e91e63"/></g>
    <g transform="translate(170,355)"><circle cy="-14" r="10" fill="url(#skin)"/><path d="M-10 -4 Q0 -8 10 -4 L12 28 L-12 28 Z" fill="#ffb300"/></g>
  </g>
  <!-- water drop -->
  <g transform="translate(470,355)" filter="url(#s)">
    <path d="M0 -38 Q26 -6 22 12 Q16 34 0 34 Q-16 34 -22 12 Q-26 -6 0 -38 Z" fill="url(#uni)"/>
    <ellipse cx="-7" cy="0" rx="5" ry="9" fill="#fff" opacity=".6"/>
  </g>
</svg>
