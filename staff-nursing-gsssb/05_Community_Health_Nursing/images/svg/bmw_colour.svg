<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="y" x1="0" x2="1"><stop offset="0" stop-color="#f9a825"/><stop offset=".45" stop-color="#fff176"/><stop offset="1" stop-color="#f57f17"/></linearGradient>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#b71c1c"/><stop offset=".45" stop-color="#ef5350"/><stop offset="1" stop-color="#7f0000"/></linearGradient>
    <linearGradient id="wt" x1="0" x2="1"><stop offset="0" stop-color="#cfd8dc"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#b0bec5"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#0d47a1"/><stop offset=".45" stop-color="#64b5f6"/><stop offset="1" stop-color="#002171"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="430" fill="#fbfbfb"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">Bio-Medical Waste Management Rules 2016 – Colour Coding</text>
  <g filter="url(#s)">
    <g transform="translate(115,120)"><path d="M-45 -50 h90 l-8 110 h-74 z" fill="url(#y)"/><rect x="-50" y="-60" width="100" height="14" rx="4" fill="#f57f17"/></g>
    <g transform="translate(335,120)"><path d="M-45 -50 h90 l-8 110 h-74 z" fill="url(#r)"/><rect x="-50" y="-60" width="100" height="14" rx="4" fill="#8e0000"/></g>
    <g transform="translate(555,120)"><rect x="-40" y="-55" width="80" height="115" rx="8" fill="url(#wt)" stroke="#78909c" stroke-width="2"/><rect x="-14" y="-62" width="28" height="10" rx="3" fill="#90a4ae"/><path d="M-20 20 L20 -20 M-18 -10 L-4 4" stroke="#455a64" stroke-width="3"/></g>
    <g transform="translate(775,120)"><rect x="-48" y="-50" width="96" height="110" rx="4" fill="#d7ccc8" stroke="#1565c0" stroke-width="5"/><rect x="-48" y="-50" width="96" height="16" fill="url(#b)"/></g>
  </g>
  <g font-weight="bold" font-size="14" text-anchor="middle">
    <text x="115" y="205" fill="#f57f17">YELLOW bag</text><text x="335" y="205" fill="#c62828">RED bag</text><text x="555" y="205" fill="#455a64">WHITE (translucent)</text><text x="775" y="205" fill="#1565c0">BLUE box</text>
  </g>
  <g font-size="11.2" fill="#263238">
    <text x="20" y="230">• Human anatomical waste</text>
    <text x="20" y="248">• Animal waste</text>
    <text x="20" y="266">• Soiled waste (dressings,</text>
    <text x="30" y="284">cotton, plaster, blood bags)</text>
    <text x="20" y="302">• Expired/ discarded medicines</text>
    <text x="20" y="320">• Chemical waste, lab cultures</text>
    <text x="20" y="338">  (pre-treated)</text>
    <text x="20" y="362" font-weight="bold" fill="#e65100">→ Incineration / plasma</text>
    <text x="20" y="378" font-weight="bold" fill="#e65100">   pyrolysis / deep burial</text>

    <text x="240" y="230">Contaminated recyclable</text>
    <text x="240" y="248">PLASTIC waste:</text>
    <text x="240" y="266">• IV sets, tubings, bottles</text>
    <text x="240" y="284">• Catheters, urine bags</text>
    <text x="240" y="302">• Syringes (without needle)</text>
    <text x="240" y="320">• Gloves, vacutainers</text>
    <text x="240" y="362" font-weight="bold" fill="#c62828">→ Autoclave/ microwave</text>
    <text x="240" y="378" font-weight="bold" fill="#c62828">   + shredding → recycle</text>

    <text x="460" y="230">Puncture-proof, leak-</text>
    <text x="460" y="248">proof, tamper-proof:</text>
    <text x="460" y="266">• Needles, syringes with</text>
    <text x="470" y="284">fixed needles</text>
    <text x="460" y="302">• Scalpel blades, lancets</text>
    <text x="460" y="320">• Any sharp metal</text>
    <text x="460" y="362" font-weight="bold" fill="#455a64">→ Autoclave + shredding/</text>
    <text x="460" y="378" font-weight="bold" fill="#455a64">   encapsulation, sharp pit</text>

    <text x="680" y="230">Cardboard box with blue</text>
    <text x="680" y="248">colour marking:</text>
    <text x="680" y="266">• Broken/ discarded glass</text>
    <text x="680" y="284">  (vials, ampoules, slides)</text>
    <text x="680" y="302">• Metallic body implants</text>
    <text x="680" y="362" font-weight="bold" fill="#1565c0">→ Disinfection +</text>
    <text x="680" y="378" font-weight="bold" fill="#1565c0">   recycling</text>
  </g>
  <text x="440" y="412" text-anchor="middle" font-size="12" fill="#b71c1c" font-weight="bold">Untreated BMW: store max 48 hrs · segregate at source · bar-code label · biohazard symbol</text>
</svg>
