<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="c" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7e57c2"/><stop offset="1" stop-color="#d1c4e9" stop-opacity=".6"/></linearGradient>
    <linearGradient id="c2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4db6ac"/><stop offset="1" stop-color="#b2dfdb" stop-opacity=".6"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="420" fill="#fcfbff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#4527a0">Normal Distribution Curve &amp; Biostatistics Basics</text>
  <g filter="url(#s)">
    <path d="M40 300 C150 300 190 290 240 240 C290 180 300 70 330 70 C360 70 370 180 420 240 C470 290 510 300 620 300 Z" fill="url(#c)"/>
    <path d="M240 300 L240 240 C290 180 300 70 330 70 C360 70 370 180 420 240 L420 300 Z" fill="url(#c2)" opacity=".75"/>
  </g>
  <path d="M30 300 H630" stroke="#37474f" stroke-width="2"/>
  <path d="M330 60 V300" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4"/>
  <g font-size="11" text-anchor="middle" fill="#37474f">
    <text x="70" y="318">−3 SD</text><text x="150" y="318">−2 SD</text><text x="240" y="318">−1 SD</text><text x="330" y="318" font-weight="bold" fill="#c62828">Mean</text>
    <text x="420" y="318">+1 SD</text><text x="510" y="318">+2 SD</text><text x="590" y="318">+3 SD</text>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="330" y="345" text-anchor="middle" fill="#00695c">± 1 SD = 68.3 %</text>
    <text x="330" y="365" text-anchor="middle" fill="#4527a0">± 2 SD = 95.4 %</text>
    <text x="330" y="385" text-anchor="middle" fill="#283593">± 3 SD = 99.7 %</text>
  </g>
  <text x="330" y="55" text-anchor="middle" font-size="11" fill="#c62828">Mean = Median = Mode</text>
  <g filter="url(#s)"><rect x="650" y="50" width="215" height="350" rx="14" fill="#fff" stroke="#d1c4e9" stroke-width="2"/></g>
  <g font-size="11.5">
    <text x="662" y="74" font-weight="bold" font-size="13.5" fill="#4527a0">Remember</text>
    <text x="662" y="98"><tspan font-weight="bold">Mean</tspan> – average</text>
    <text x="662" y="116"><tspan font-weight="bold">Median</tspan> – middle value</text>
    <text x="662" y="134"><tspan font-weight="bold">Mode</tspan> – most frequent</text>
    <text x="662" y="152"><tspan font-weight="bold">Range</tspan> – max − min</text>
    <text x="662" y="170"><tspan font-weight="bold">SD</tspan> – best dispersion</text>
    <text x="662" y="196" font-weight="bold" fill="#00695c">Diagrams</text>
    <text x="662" y="214">Histogram – continuous</text>
    <text x="662" y="232">Bar – discrete/ qualitative</text>
    <text x="662" y="250">Pie – proportions</text>
    <text x="662" y="268">Line graph – trend/ time</text>
    <text x="662" y="286">Scatter – correlation</text>
    <text x="662" y="304">Pictogram – lay people</text>
    <text x="662" y="330" font-weight="bold" fill="#00695c">Tests</text>
    <text x="662" y="348">Chi-square – proportions</text>
    <text x="662" y="366">t-test – means (small)</text>
    <text x="662" y="384">p &lt; 0.05 – significant</text>
  </g>
</svg>
