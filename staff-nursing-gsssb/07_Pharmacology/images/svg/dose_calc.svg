<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#b3e5fc"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#4fc3f7"/></linearGradient>
    <radialGradient id="drop" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#29b6f6"/><stop offset="1" stop-color="#01579b"/></radialGradient>
    <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#ede7f6"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="440" fill="#fafbff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#4527a0">Drug Dose &amp; IV Flow Rate Calculations</text>
  <g transform="translate(110,190)" filter="url(#s)">
    <path d="M-55 -130 h110 v150 q0 30 -30 30 h-50 q-30 0 -30 -30 z" fill="url(#bag)" stroke="#0288d1" stroke-width="2"/>
    <rect x="-40" y="-110" width="80" height="40" rx="5" fill="#fff" stroke="#0288d1"/>
    <text x="0" y="-92" text-anchor="middle" font-size="11" font-weight="bold" fill="#01579b">NS 0.9 %</text>
    <text x="0" y="-77" text-anchor="middle" font-size="10" fill="#01579b">1000 ml</text>
    <rect x="-6" y="50" width="12" height="30" fill="#90a4ae"/>
    <rect x="-14" y="80" width="28" height="44" rx="6" fill="url(#bag)" stroke="#0288d1"/>
    <circle cx="0" cy="98" r="6" fill="url(#drop)"/>
    <path d="M0 124 Q10 170 40 200" stroke="#78909c" stroke-width="3" fill="none"/>
  </g>
  <g filter="url(#s)">
    <rect x="230" y="50" width="300" height="175" rx="14" fill="url(#card)" stroke="#b39ddb" stroke-width="2"/>
    <rect x="550" y="50" width="310" height="175" rx="14" fill="url(#card)" stroke="#b39ddb" stroke-width="2"/>
    <rect x="230" y="240" width="630" height="185" rx="14" fill="#fff" stroke="#b39ddb" stroke-width="2"/>
  </g>
  <g font-size="12">
    <text x="245" y="76" font-weight="bold" font-size="14" fill="#4527a0">IV drip rate (drops/min)</text>
    <text x="245" y="104" font-size="14" font-weight="bold">= Volume (ml) × Drop factor</text>
    <text x="300" y="124" font-size="14" font-weight="bold">Time (minutes)</text>
    <path d="M245 109 H470" stroke="#4527a0" stroke-width="1.5"/>
    <text x="245" y="152">Macro set: <tspan font-weight="bold">15 or 20 drops/ml</tspan></text>
    <text x="245" y="172">Micro (paediatric): <tspan font-weight="bold">60 drops/ml</tspan></text>
    <text x="245" y="192">(micro: drops/min = ml/hr)</text>
    <text x="245" y="212" fill="#455a64">ml/hr = total volume ÷ hours</text>

    <text x="565" y="76" font-weight="bold" font-size="14" fill="#4527a0">Tablet / liquid dose</text>
    <text x="565" y="104" font-size="14" font-weight="bold">= Desired (D)  × Vehicle (V)</text>
    <text x="620" y="124" font-size="14" font-weight="bold">Have (H)</text>
    <path d="M565 109 H750" stroke="#4527a0" stroke-width="1.5"/>
    <text x="565" y="152">mg/kg dose = weight (kg) × mg/kg</text>
    <text x="565" y="172">1 g = 1000 mg · 1 mg = 1000 µg</text>
    <text x="565" y="192">1 tsp = 5 ml · 1 tbsp = 15 ml</text>
    <text x="565" y="212">1 kg = 2.2 lb · 1 inch = 2.54 cm</text>

    <text x="245" y="266" font-weight="bold" font-size="14" fill="#4527a0">Worked examples</text>
    <text x="245" y="292"><tspan font-weight="bold">1.</tspan> 1000 ml NS in 8 hrs, drop factor 20: 1000 × 20 ÷ 480 = <tspan font-weight="bold" fill="#c62828">≈ 42 drops/min</tspan></text>
    <text x="245" y="316"><tspan font-weight="bold">2.</tspan> 500 ml in 4 hrs, drop factor 15: 500 × 15 ÷ 240 = <tspan font-weight="bold" fill="#c62828">≈ 31 drops/min</tspan></text>
    <text x="245" y="340"><tspan font-weight="bold">3.</tspan> Order 250 mg, available 125 mg/5 ml: 250 ÷ 125 × 5 = <tspan font-weight="bold" fill="#c62828">10 ml</tspan></text>
    <text x="245" y="364"><tspan font-weight="bold">4.</tspan> Order 0.5 g, tablet 250 mg: 500 ÷ 250 = <tspan font-weight="bold" fill="#c62828">2 tablets</tspan></text>
    <text x="245" y="388"><tspan font-weight="bold">5.</tspan> Heparin 5000 U, vial 25,000 U/5 ml: 5000 ÷ 25000 × 5 = <tspan font-weight="bold" fill="#c62828">1 ml</tspan></text>
    <text x="245" y="412"><tspan font-weight="bold">6.</tspan> Paracetamol 15 mg/kg, 20 kg child = <tspan font-weight="bold" fill="#c62828">300 mg</tspan></text>
  </g>
</svg>
