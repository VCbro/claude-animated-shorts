<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <radialGradient id="a" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#4fc3f7"/><stop offset=".55" stop-color="#0288d1"/><stop offset="1" stop-color="#01579b"/></radialGradient>
    <radialGradient id="d" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#66bb6a"/><stop offset=".55" stop-color="#2e7d32"/><stop offset="1" stop-color="#1b5e20"/></radialGradient>
    <radialGradient id="m" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffa726"/><stop offset=".55" stop-color="#ef6c00"/><stop offset="1" stop-color="#e65100"/></radialGradient>
    <radialGradient id="e" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ab47bc"/><stop offset=".55" stop-color="#6a1b9a"/><stop offset="1" stop-color="#4a148c"/></radialGradient>
    <linearGradient id="ar" x1="0" x2="1"><stop offset="0" stop-color="#b0bec5"/><stop offset="1" stop-color="#546e7a"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="460" fill="#fafcff"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#01579b">Pharmacokinetics (ADME) &amp; Injection Angles</text>
  <path d="M175 110 H225 M390 110 H440 M605 110 H655" stroke="url(#ar)" stroke-width="8"/>
  <g filter="url(#s)">
    <circle cx="110" cy="110" r="62" fill="url(#a)"/><circle cx="325" cy="110" r="62" fill="url(#d)"/>
    <circle cx="540" cy="110" r="62" fill="url(#m)"/><circle cx="755" cy="110" r="62" fill="url(#e)"/>
  </g>
  <g fill="#fff" font-weight="bold" text-anchor="middle" font-size="13">
    <text x="110" y="106">ABSORPTION</text><text x="110" y="122" font-size="10.5">site → blood</text>
    <text x="325" y="106">DISTRIBUTION</text><text x="325" y="122" font-size="10.5">blood → tissues</text>
    <text x="540" y="106">METABOLISM</text><text x="540" y="122" font-size="10.5">mainly liver</text>
    <text x="755" y="106">EXCRETION</text><text x="755" y="122" font-size="10.5">mainly kidney</text>
  </g>
  <g font-size="11" fill="#263238">
    <text x="30" y="198">IV = 100 % bioavailability</text>
    <text x="30" y="214">First-pass effect ↓ oral</text>
    <text x="30" y="230">(nitroglycerin → SL)</text>
    <text x="245" y="198">Plasma protein binding</text>
    <text x="245" y="214">(albumin) – free drug acts</text>
    <text x="245" y="230">BBB, placenta barriers</text>
    <text x="460" y="198">Cytochrome P450</text>
    <text x="460" y="214">Inducers: rifampicin, phenytoin</text>
    <text x="460" y="230">Inhibitors: erythromycin, cimetidine</text>
    <text x="675" y="198">Half-life (t½) – conc. falls</text>
    <text x="675" y="214">to 50 %; steady state &amp;</text>
    <text x="675" y="230">elimination ≈ 4–5 t½</text>
  </g>
  <!-- injection angles -->
  <g filter="url(#s)"><rect x="20" y="255" width="840" height="190" rx="14" fill="#fff" stroke="#b3e5fc" stroke-width="2"/></g>
  <rect x="60" y="300" width="400" height="22" fill="#ffe0b2"/><rect x="60" y="322" width="400" height="28" fill="#fff59d"/>
  <rect x="60" y="350" width="400" height="34" fill="#ffccbc"/><rect x="60" y="384" width="400" height="40" fill="#ef9a9a"/>
  <g font-size="10.5" fill="#5d4037">
    <text x="465" y="315">Epidermis</text><text x="465" y="340">Dermis</text><text x="465" y="372">Subcutaneous fat</text><text x="465" y="408">Muscle</text>
  </g>
  <g stroke-width="4" stroke-linecap="round">
    <path d="M110 300 L170 316" stroke="#6a1b9a"/>
    <path d="M230 290 L265 345" stroke="#2e7d32"/>
    <path d="M350 280 L350 405" stroke="#c62828"/>
    
  </g>
  <g font-weight="bold" font-size="12">
    <text x="85" y="287" fill="#6a1b9a">ID 10–15°</text>
    <text x="210" y="280" fill="#2e7d32">SC 45° (90°)</text>
    <text x="320" y="272" fill="#c62828">IM 90°</text>
  </g>
  <g font-size="11.5">
    <text x="580" y="285" font-weight="bold" fill="#01579b" font-size="13">Routes – key points</text>
    <text x="580" y="307"><tspan font-weight="bold">ID</tspan> – 0.1 ml (BCG, Mantoux, test dose)</text>
    <text x="580" y="327"><tspan font-weight="bold">SC</tspan> – ≤ 1 ml (insulin, heparin)</text>
    <text x="580" y="347"><tspan font-weight="bold">IM</tspan> – deltoid ≤ 1–2 ml; ventrogluteal</text>
    <text x="590" y="363">(safest) up to 3–5 ml</text>
    <text x="580" y="383"><tspan font-weight="bold">Z-track</tspan> – iron dextran, irritants</text>
    <text x="580" y="403"><tspan font-weight="bold">SL</tspan> – fast, no first-pass</text>
    <text x="580" y="423"><tspan font-weight="bold">IV</tspan> – fastest, 100 % bioavailable</text>
  </g>
</svg>
