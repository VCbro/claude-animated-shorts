<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity=".3"/></filter>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcdd2"/><stop offset=".5" stop-color="#e53935"/><stop offset="1" stop-color="#7f0000"/></linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe0b2"/><stop offset=".5" stop-color="#fb8c00"/><stop offset="1" stop-color="#8a4500"/></linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9c4"/><stop offset=".5" stop-color="#fbc02d"/><stop offset="1" stop-color="#8a6500"/></linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset=".5" stop-color="#43a047"/><stop offset="1" stop-color="#174d1a"/></linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbdefb"/><stop offset=".5" stop-color="#1e88e5"/><stop offset="1" stop-color="#0d3c7a"/></linearGradient>
    <linearGradient id="r6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e1bee7"/><stop offset=".5" stop-color="#8e24aa"/><stop offset="1" stop-color="#3d0b4f"/></linearGradient>
    <radialGradient id="hand" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e0f7fa"/><stop offset="1" stop-color="#00acc1"/></radialGradient>
  </defs>
  <rect width="700" height="440" fill="#fbfdff"/>
  <text x="350" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">Chain of Infection – 6 Links (koi ek todo → infection ruk jaye)</text>
  <g transform="translate(350,235)" filter="url(#s)" fill="none" stroke-width="22">
    <ellipse cx="0" cy="-130" rx="58" ry="34" stroke="url(#r1)"/>
    <ellipse cx="113" cy="-65" rx="58" ry="34" stroke="url(#r2)" transform="rotate(60 113 -65)"/>
    <ellipse cx="113" cy="65" rx="58" ry="34" stroke="url(#r3)" transform="rotate(-60 113 65)"/>
    <ellipse cx="0" cy="130" rx="58" ry="34" stroke="url(#r4)"/>
    <ellipse cx="-113" cy="65" rx="58" ry="34" stroke="url(#r5)" transform="rotate(60 -113 65)"/>
    <ellipse cx="-113" cy="-65" rx="58" ry="34" stroke="url(#r6)" transform="rotate(-60 -113 -65)"/>
  </g>
  <g transform="translate(350,235)" filter="url(#s)">
    <circle r="55" fill="url(#hand)"/>
    <text y="-6" text-anchor="middle" font-weight="bold" fill="#004d40" font-size="13">HAND</text>
    <text y="12" text-anchor="middle" font-weight="bold" fill="#004d40" font-size="13">HYGIENE</text>
    <text y="28" text-anchor="middle" fill="#004d40" font-size="10">breaks every link</text>
  </g>
  <g font-weight="bold" font-size="13" text-anchor="middle">
    <text x="350" y="60" fill="#b71c1c">1. Infectious agent</text>
    <text x="590" y="140" fill="#e65100">2. Reservoir</text>
    <text x="590" y="345" fill="#a07800">3. Portal of exit</text>
    <text x="350" y="418" fill="#2e7d32">4. Mode of transmission</text>
    <text x="110" y="345" fill="#1565c0">5. Portal of entry</text>
    <text x="110" y="140" fill="#6a1b9a">6. Susceptible host</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#455a64">
    <text x="350" y="76">bacteria, virus, fungi → sterilization, disinfection</text>
    <text x="590" y="156">human, animal, water, soil,</text><text x="590" y="170">equipment → cleaning</text>
    <text x="590" y="361">blood, secretions, excreta,</text><text x="590" y="375">droplets → PPE, dressing</text>
    <text x="350" y="434">contact, droplet, airborne, vehicle, vector → hand hygiene, isolation</text>
    <text x="110" y="361">broken skin, mucosa, catheter,</text><text x="110" y="375">IV → asepsis, sterile technique</text>
    <text x="110" y="156">elderly, newborn, diabetic,</text><text x="110" y="170">low immunity → vaccine, nutrition</text>
  </g>
</svg>
