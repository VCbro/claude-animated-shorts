<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="DejaVu Sans, Arial" font-size="13">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="10" stdDeviation="7" flood-opacity=".3"/></filter>
    <linearGradient id="l1" x1="0" x2="1"><stop offset="0" stop-color="#ef5350"/><stop offset="1" stop-color="#ff8a80"/></linearGradient>
    <linearGradient id="l2" x1="0" x2="1"><stop offset="0" stop-color="#fb8c00"/><stop offset="1" stop-color="#ffcc80"/></linearGradient>
    <linearGradient id="l3" x1="0" x2="1"><stop offset="0" stop-color="#fdd835"/><stop offset="1" stop-color="#fff59d"/></linearGradient>
    <linearGradient id="l4" x1="0" x2="1"><stop offset="0" stop-color="#43a047"/><stop offset="1" stop-color="#a5d6a7"/></linearGradient>
    <linearGradient id="l5" x1="0" x2="1"><stop offset="0" stop-color="#1e88e5"/><stop offset="1" stop-color="#90caf9"/></linearGradient>
  </defs>
  <rect width="700" height="440" fill="#fbfaff"/>
  <text x="350" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#4527a0">Maslow's Hierarchy of Needs (1943) – Priority setting</text>
  <g filter="url(#s)" stroke="#fff" stroke-width="2">
    <!-- level1 base -->
    <path d="M70 400 L410 400 L376 330 L104 330 Z" fill="url(#l1)"/><path d="M410 400 L470 370 L430 304 L376 330 Z" fill="#b71c1c"/>
    <path d="M104 328 L376 328 L342 260 L138 260 Z" fill="url(#l2)"/><path d="M376 328 L430 302 L392 236 L342 260 Z" fill="#e65100"/>
    <path d="M138 258 L342 258 L308 190 L172 190 Z" fill="url(#l3)"/><path d="M342 258 L392 234 L354 168 L308 190 Z" fill="#f9a825"/>
    <path d="M172 188 L308 188 L274 120 L206 120 Z" fill="url(#l4)"/><path d="M308 188 L354 166 L316 100 L274 120 Z" fill="#2e7d32"/>
    <path d="M206 118 L274 118 L240 50 Z" fill="url(#l5)"/><path d="M274 118 L316 98 L240 50 Z" fill="#1565c0"/>
  </g>
  <g font-weight="bold" text-anchor="middle" fill="#fff" font-size="12.5">
    <text x="240" y="372">1. PHYSIOLOGICAL</text>
    <text x="240" y="300">2. SAFETY &amp; SECURITY</text>
    <text x="240" y="230" fill="#5d4037">3. LOVE &amp; BELONGING</text>
    <text x="240" y="160">4. ESTEEM</text>
    <text x="240" y="108" font-size="14">5</text>
  </g>
  <g font-size="12">
    <text x="480" y="80" font-weight="bold" fill="#1565c0">5. Self-actualization</text><text x="480" y="95">Apni full potential achieve karna</text>
    <text x="480" y="140" font-weight="bold" fill="#2e7d32">4. Esteem</text><text x="480" y="155">Self-respect, recognition, dignity</text>
    <text x="480" y="205" font-weight="bold" fill="#f57f17">3. Love &amp; belonging</text><text x="480" y="220">Family, friends, acceptance</text>
    <text x="480" y="275" font-weight="bold" fill="#e65100">2. Safety &amp; security</text><text x="480" y="290">Physical safety, fall/ infection</text><text x="480" y="305">prevention, freedom from fear</text>
    <text x="480" y="350" font-weight="bold" fill="#c62828">1. Physiological (sabse pehle)</text><text x="480" y="365">O₂/airway, water, food, elimination,</text><text x="480" y="380">sleep, temperature, sex</text>
  </g>
  <text x="20" y="428" font-size="12" fill="#4527a0">Neeche wali need pehle puri karo → upar wali. Physiological me bhi order: <tspan font-weight="bold">Airway → Breathing → Circulation</tspan>.</text>
</svg>
