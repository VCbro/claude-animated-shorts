<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="DejaVu Sans, Arial" font-size="11.5">
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="5" dy="9" stdDeviation="6" flood-opacity=".35"/></filter>
    <linearGradient id="y" x1="0" x2="1"><stop offset="0" stop-color="#c79a00"/><stop offset=".35" stop-color="#ffe74c"/><stop offset="1" stop-color="#a87f00"/></linearGradient>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#9a0f0f"/><stop offset=".35" stop-color="#ff5a52"/><stop offset="1" stop-color="#7a0a0a"/></linearGradient>
    <linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#b0bec5"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#90a4ae"/></linearGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#0d3c7a"/><stop offset=".35" stop-color="#4fa3f7"/><stop offset="1" stop-color="#0a2f61"/></linearGradient>
    <g id="bin"><path d="M-55 0 L55 0 L45 150 Q0 160 -45 150 Z"/><ellipse cx="0" cy="0" rx="58" ry="14"/><path d="M-62 -8 Q0 -30 62 -8 L62 -2 Q0 -22 -62 -2 Z" fill="#263238" opacity=".5"/><rect x="-40" y="10" width="10" height="130" rx="5" fill="#fff" opacity=".25"/></g>
  </defs>
  <rect width="720" height="460" fill="#fbfdff"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#33691e">Biomedical Waste Segregation – BMW Rules 2016 (amended 2018)</text>
  <g filter="url(#s)" stroke="#37474f" stroke-width="1.5">
    <g transform="translate(95,95)" fill="url(#y)"><use href="#bin"/></g>
    <g transform="translate(270,95)" fill="url(#r)"><use href="#bin"/></g>
    <g transform="translate(445,95)" fill="url(#w)"><use href="#bin"/></g>
    <g transform="translate(615,95)">
      <path d="M-50 10 L50 10 L50 150 L-50 150 Z" fill="url(#b)"/><path d="M-50 10 L-30 -8 L70 -8 L50 10 Z" fill="#6fb6ff"/><path d="M50 10 L70 -8 L70 132 L50 150 Z" fill="#082a55"/>
      <rect x="-36" y="20" width="8" height="120" rx="4" fill="#fff" opacity=".25"/>
    </g>
  </g>
  <g font-weight="bold" font-size="14" text-anchor="middle" fill="#fff">
    <text x="95" y="175" fill="#5d4600">YELLOW</text><text x="270" y="175">RED</text><text x="445" y="168" fill="#37474f">WHITE</text><text x="445" y="185" fill="#37474f" font-size="10">translucent</text><text x="615" y="175">BLUE</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">
    <text x="95" y="195" fill="#5d4600">plastic bag</text><text x="270" y="195">plastic bag</text><text x="445" y="205" fill="#37474f">puncture-proof</text><text x="615" y="195">cardboard box</text>
  </g>
  <g transform="translate(25,275)">
    <text x="0" y="0" font-weight="bold" fill="#9a7400">Infectious, anatomical</text>
    <text x="0" y="16">• Human/animal body parts</text><text x="0" y="31">• Soiled dressing, cotton,</text><text x="0" y="46">  plaster, blood bags</text><text x="0" y="61">• Expired/ discarded drugs</text><text x="0" y="76">• Chemical &amp; lab waste</text>
    <text x="0" y="98" fill="#c62828" font-weight="bold">→ Incineration /</text><text x="0" y="113" fill="#c62828" font-weight="bold">deep burial</text>
  </g>
  <g transform="translate(200,275)">
    <text x="0" y="0" font-weight="bold" fill="#b71c1c">Contaminated recyclable</text>
    <text x="0" y="16">• IV sets, tubings, bottles</text><text x="0" y="31">• Catheters, urine bags</text><text x="0" y="46">• Syringes (without needle)</text><text x="0" y="61">• Gloves, vacutainers</text>
    <text x="0" y="98" fill="#c62828" font-weight="bold">→ Autoclave + shred</text><text x="0" y="113" fill="#c62828" font-weight="bold">→ recycle</text>
  </g>
  <g transform="translate(380,275)">
    <text x="0" y="0" font-weight="bold" fill="#37474f">Waste sharps</text>
    <text x="0" y="16">• Needles, syringes with</text><text x="0" y="31">  fixed needles</text><text x="0" y="46">• Scalpel, blades, lancets</text><text x="0" y="61">• Any metal that can cut</text>
    <text x="0" y="98" fill="#c62828" font-weight="bold">→ Autoclave + shred</text><text x="0" y="113" fill="#c62828" font-weight="bold">/ encapsulation</text>
  </g>
  <g transform="translate(555,275)">
    <text x="0" y="0" font-weight="bold" fill="#0d47a1">Glassware</text>
    <text x="0" y="16">• Broken/ discarded glass</text><text x="0" y="31">• Vials, ampoules</text><text x="0" y="46">• Metallic body implants</text>
    <text x="0" y="98" fill="#c62828" font-weight="bold">→ Disinfect</text><text x="0" y="113" fill="#c62828" font-weight="bold">→ recycle</text>
  </g>
  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#33691e">General (non-infectious) waste → BLACK bin (dry) / GREEN bin (wet)</text><text x="360" y="440" text-anchor="middle" font-size="12" fill="#33691e">BMW 48 hrs ke andar treat/ dispose · Bag 3/4 bharne par seal · Bar-code label</text>
</svg>
