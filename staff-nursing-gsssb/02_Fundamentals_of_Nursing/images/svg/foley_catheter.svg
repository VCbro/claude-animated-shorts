    <path d="M470 110 L515 150" stroke="#f0a24a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="522" cy="78" r="9" fill="#ef5350"/>
  </g>
  <g font-size="11.5">
    <text x="40" y="160" font-weight="bold" fill="#c62828">Eye / drainage hole</text><text x="40" y="175">tip par</text>
    <text x="95" y="72" text-anchor="middle" font-weight="bold" fill="#e65100">Balloon</text><text x="95" y="86" text-anchor="middle">5–10 ml (adult)</text>
    <text x="540" y="76" font-weight="bold" fill="#c62828">Balloon port</text><text x="540" y="90">sterile water se fill</text>
    <text x="545" y="128" font-weight="bold" fill="#1565c0">Drainage port</text><text x="545" y="142">→ urine bag</text>
    <text x="530" y="170" font-weight="bold" fill="#2e7d32">3rd port (3-way)</text><text x="530" y="184">CBI irrigation (TURP)</text>
  </g>
  <!-- bladder + bag -->
