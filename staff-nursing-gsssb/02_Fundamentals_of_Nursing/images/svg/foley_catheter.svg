    <path d="M332 190 L438 190 L438 236 Q385 248 332 236 Z" fill="url(#urine)" opacity=".85"/>
    <g stroke="#546e7a"><line x1="340" y1="150" x2="355" y2="150"/><line x1="340" y1="170" x2="355" y2="170"/><line x1="340" y1="210" x2="355" y2="210"/></g>
    <rect x="340" y="126" width="8" height="110" rx="4" fill="#fff" opacity=".7"/>
    <rect x="378" y="250" width="14" height="22" rx="3" fill="#78909c"/>
    <line x1="-20" y1="60" x2="460" y2="60" stroke="#c62828" stroke-dasharray="6 4"/>
  </g>
  <g font-size="11.5">
    <text x="545" y="270" font-weight="bold" fill="#c62828">Bag ALWAYS below</text><text x="545" y="285" font-weight="bold" fill="#c62828">bladder level</text><text x="545" y="300">(red line) – backflow → UTI</text>
    <text x="545" y="325">Floor par nahi · no kinks</text><text x="545" y="340">Empty when 2/3 full</text><text x="545" y="355">Closed system rakho</text>
    <text x="20" y="508" fill="#4e342e"><tspan font-weight="bold">Insertion:</tspan> Female 5–7.5 cm (2–3 inch) till urine, then 2.5 cm more · Male: penis 60–90° up, 17–22 cm (7–9 inch)</text>
  </g>
