<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3e0"/><stop offset=".4" stop-color="#ffcc80"/><stop offset="1" stop-color="#c77800"/></linearGradient>
    <radialGradient id="bal" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffe0b2"/><stop offset="1" stop-color="#e09a3a"/></radialGradient>
    <radialGradient id="blad" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff9c4"/><stop offset=".6" stop-color="#fbc02d"/><stop offset="1" stop-color="#b28704"/></radialGradient>
    <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd6ef"/></linearGradient>
    <linearGradient id="urine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="720" height="520" fill="#fffdf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">Foley (Indwelling) Catheter &amp; Closed Drainage</text>
  <!-- catheter -->
