<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#d99a74"/><stop offset=".45" stop-color="#ffe0c9"/><stop offset="1" stop-color="#c98560"/></linearGradient>
    <radialGradient id="but" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe9da"/><stop offset="1" stop-color="#d9946a"/></radialGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#69f0ae"/><stop offset="1" stop-color="#00796b"/></radialGradient>
    <radialGradient id="bad" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ff8a80"/><stop offset="1" stop-color="#b71c1c"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="760" height="500" fill="#fbfdff"/>
  <text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#00695c">IM Injection Sites – Kahan aur kaise</text>
  <!-- Deltoid: arm -->
  <g transform="translate(40,60)" filter="url(#s)">
    <path d="M30 0 Q90 -10 120 30 L118 230 Q100 245 60 240 L40 60 Q10 40 30 0 Z" fill="url(#sk)" stroke="#a5683f" stroke-width="2"/>
    <line x1="40" y1="25" x2="115" y2="25" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M60 50 L100 50 L80 95 Z" fill="#69f0ae" opacity=".55" stroke="#00796b" stroke-width="2"/>
    <circle cx="80" cy="66" r="7" fill="url(#dot)"/>
  </g>
  <g transform="translate(20,320)">
    <text x="0" y="0" font-weight="bold" fill="#00695c" font-size="13">1. DELTOID</text>
    <text x="0" y="16">Acromion se 2–3 finger</text><text x="0" y="31">(2.5–5 cm) neeche, triangle</text>
    <text x="0" y="46">Max <tspan font-weight="bold">1 ml</tspan> · Hep B, Td, rabies</text>
    <text x="0" y="61" fill="#c62828">Radial &amp; axillary nerve</text>
  </g>
  <!-- Ventrogluteal: hip side view with hand -->
  <g transform="translate(205,60)" filter="url(#s)">
    <path d="M20 20 Q90 0 150 30 Q175 120 150 230 L40 235 Q5 140 20 20 Z" fill="url(#sk)" stroke="#a5683f" stroke-width="2"/>
    <circle cx="125" cy="150" r="9" fill="#5d4037"/>
    <circle cx="70" cy="62" r="7" fill="#5d4037"/>
    <path d="M125 150 L70 62 M125 150 L120 55" stroke="#ff9800" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 62 L120 55 L125 150 Z" fill="#69f0ae" opacity=".45"/>
    <circle cx="105" cy="95" r="8" fill="url(#dot)"/>
  </g>
  <g transform="translate(200,320)">
    <text x="0" y="0" font-weight="bold" fill="#00695c" font-size="13">2. VENTROGLUTEAL ★</text>
    <text x="0" y="16">Palm on greater trochanter,</text><text x="0" y="31">index finger → ASIS, middle</text><text x="0" y="46">finger → iliac crest; V ke beech</text>
    <text x="0" y="61" fill="#2e7d32" font-weight="bold">SAFEST site</text><text x="0" y="76" fill="#2e7d32">(adults &amp; children)</text>
  </g>
  <!-- Vastus lateralis: thigh -->
  <g transform="translate(415,60)" filter="url(#s)">
    <path d="M30 0 L120 0 Q130 120 112 240 L45 240 Q20 120 30 0 Z" fill="url(#sk)" stroke="#a5683f" stroke-width="2"/>
    <line x1="25" y1="25" x2="130" y2="25" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 3"/>
    <line x1="35" y1="215" x2="118" y2="215" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="80" y="85" width="34" height="65" rx="8" fill="#69f0ae" opacity=".55" stroke="#00796b" stroke-width="2"/>
    <circle cx="97" cy="118" r="7" fill="url(#dot)"/>
  </g>
  <g transform="translate(400,320)">
    <text x="0" y="0" font-weight="bold" fill="#00695c" font-size="13">3. VASTUS LATERALIS</text>
    <text x="0" y="16">Thigh ka middle 1/3,</text><text x="0" y="31">anterolateral side</text>
    <text x="0" y="46" fill="#2e7d32" font-weight="bold">Infants &lt; 1 yr –</text><text x="0" y="61" fill="#2e7d32" font-weight="bold">site of choice</text>
    <text x="0" y="76">(Pentavalent, IPV)</text>
  </g>
  <!-- Dorsogluteal: buttock quadrants -->
  <g transform="translate(615,70)" filter="url(#s)">
    <ellipse cx="55" cy="110" rx="58" ry="100" fill="url(#but)" stroke="#a5683f" stroke-width="2"/>
    <line x1="55" y1="10" x2="55" y2="210" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 3"/>
    <line x1="-3" y1="110" x2="113" y2="110" stroke="#3949ab" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="80" cy="70" r="8" fill="url(#dot)"/>
    <path d="M20 140 q20 30 10 60" stroke="#ffeb3b" stroke-width="7" fill="none"/>
    <circle cx="28" cy="165" r="7" fill="url(#bad)"/>
  </g>
  <g transform="translate(598,320)">
    <text x="0" y="0" font-weight="bold" fill="#00695c" font-size="13">4. DORSOGLUTEAL</text>
    <text x="0" y="16">Upper OUTER quadrant</text>
    <text x="0" y="31" fill="#c62828">Sciatic nerve injury risk</text><text x="0" y="46" fill="#c62828">(yellow) – ab avoid</text>
    <text x="0" y="61">&lt; 3 yrs me NEVER</text>
  </g>
  <g transform="translate(20,420)" font-size="12">
    <text x="0" y="0"><tspan font-weight="bold" fill="#c62828">Z-track:</tspan> skin 2.5–3.5 cm side me kheencho → 90° inject → 10 sec ruko → needle nikalo → skin chhodo · massage nahi</text>
    <text x="0" y="20"><tspan font-weight="bold" fill="#1565c0">Needle:</tspan> IM 21–23 G, 1–1.5 inch · SC 25–27 G, ½–⅝ inch · ID 26–27 G, ⅜–½ inch</text>
    <text x="0" y="40" fill="#00695c">Green dot = injection point · Dotted lines = landmarks · Brown dots = bony landmarks (trochanter, ASIS)</text>
    <text x="0" y="60" fill="#c62828">Red dot + yellow line = sciatic nerve area (danger zone)</text>
  </g>
</svg>
