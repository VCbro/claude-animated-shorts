<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="DejaVu Sans, Arial" font-size="11.5">
  <defs>
    <linearGradient id="lim" x1="0" x2="1"><stop offset="0" stop-color="#c98560"/><stop offset=".45" stop-color="#ffe0c9"/><stop offset="1" stop-color="#b9774f"/></linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f3f0e6"/><stop offset="1" stop-color="#c9c2ad"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
    <g id="limb"><rect x="-26" y="0" width="52" height="210" rx="22" fill="url(#lim)" stroke="#9c5f3c" stroke-width="1.5"/></g>
  </defs>
  <rect width="720" height="420" fill="#fffdf8"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#5d4037">Roller Bandage – Types of Turns</text>
  <!-- circular -->
  <g transform="translate(70,60)" filter="url(#s)"><use href="#limb"/>
    <rect x="-28" y="90" width="56" height="18" rx="4" fill="url(#bd)" stroke="#a1887f"/><rect x="-28" y="94" width="56" height="18" rx="4" fill="url(#bd)" stroke="#a1887f" opacity=".9"/></g>
  <!-- spiral -->
  <g transform="translate(185,60)" filter="url(#s)"><use href="#limb"/>
    <g fill="url(#bd)" stroke="#a1887f"><path d="M-28 160 L28 140 L28 156 L-28 176 Z"/><path d="M-28 132 L28 112 L28 128 L-28 148 Z"/><path d="M-28 104 L28 84 L28 100 L-28 120 Z"/><path d="M-28 76 L28 56 L28 72 L-28 92 Z"/></g></g>
  <!-- reverse spiral -->
  <g transform="translate(300,60)" filter="url(#s)"><use href="#limb"/>
    <g fill="url(#bd)" stroke="#a1887f"><path d="M-28 160 L0 148 L28 160 L28 176 L0 164 L-28 176 Z"/><path d="M-28 132 L0 120 L28 132 L28 148 L0 136 L-28 148 Z"/><path d="M-28 104 L0 92 L28 104 L28 120 L0 108 L-28 120 Z"/><path d="M-28 76 L0 64 L28 76 L28 92 L0 80 L-28 92 Z"/></g>
    <g stroke="#795548" stroke-width="1.5"><line x1="0" y1="64" x2="0" y2="176"/></g></g>
  <!-- figure of 8 at joint -->
  <g transform="translate(420,60)" filter="url(#s)">
    <rect x="-26" y="0" width="52" height="105" rx="22" fill="url(#lim)" stroke="#9c5f3c" stroke-width="1.5"/>
    <rect x="-26" y="100" width="52" height="110" rx="22" fill="url(#lim)" stroke="#9c5f3c" stroke-width="1.5" transform="rotate(-25 0 105)"/>
    <g fill="url(#bd)" stroke="#a1887f"><path d="M-28 70 L28 120 L28 136 L-28 86 Z"/><path d="M28 70 L-28 120 L-28 136 L28 86 Z"/></g>
    <circle cx="0" cy="103" r="6" fill="#ff7043"/></g>
  <!-- spica -->
  <g transform="translate(540,60)" filter="url(#s)">
    <rect x="-20" y="40" width="40" height="170" rx="18" fill="url(#lim)" stroke="#9c5f3c" stroke-width="1.5"/>
    <rect x="-34" y="0" width="68" height="60" rx="26" fill="url(#lim)" stroke="#9c5f3c" stroke-width="1.5"/>
    <g fill="url(#bd)" stroke="#a1887f"><path d="M-34 30 L22 70 L22 84 L-34 44 Z"/><path d="M34 30 L-22 70 L-22 84 L34 44 Z"/><path d="M-34 44 L22 84 L22 98 L-34 58 Z" opacity=".9"/></g></g>
  <!-- recurrent -->
  <g transform="translate(655,60)" filter="url(#s)"><use href="#limb"/>
    <g fill="url(#bd)" stroke="#a1887f"><path d="M-26 25 Q0 -18 26 25 L26 95 L14 95 L14 30 Q0 4 -14 30 L-14 95 L-26 95 Z"/><rect x="-28" y="90" width="56" height="18" rx="4"/></g></g>
  <g font-weight="bold" text-anchor="middle" font-size="12.5" fill="#4e342e">
    <text x="70" y="295">Circular</text><text x="185" y="295">Spiral</text><text x="300" y="295">Reverse spiral</text><text x="420" y="295">Figure of 8</text><text x="540" y="295">Spica</text><text x="655" y="295">Recurrent</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#455a64">
    <text x="70" y="312">start &amp; end anchor;</text><text x="70" y="325">wrist, forehead</text>
    <text x="185" y="312">same-width parts</text><text x="185" y="325">(finger, upper arm)</text>
    <text x="300" y="312">cone-shaped part</text><text x="300" y="325">(forearm, leg)</text>
    <text x="420" y="312">joints – elbow,</text><text x="420" y="325">knee, ankle</text>
    <text x="540" y="312">shoulder, hip,</text><text x="540" y="325">thumb, groin</text>
    <text x="655" y="312">stump, head,</text><text x="655" y="325">fingertip</text>
  </g>
  <g font-size="12" transform="translate(25,355)">
    <text x="0" y="0"><tspan font-weight="bold" fill="#c62828">Rules:</tspan> distal → proximal (venous return) · each turn covers <tspan font-weight="bold">2/3 of previous</tspan> · start &amp; finish with circular turns</text>
    <text x="0" y="20">Part in <tspan font-weight="bold">functional position</tspan>, bony prominences padded · fingertips/toes <tspan font-weight="bold">exposed</tspan> to check circulation (CSM)</text>
    <text x="0" y="40">Head = <tspan font-weight="bold">Capeline</tspan> · Abdomen = many-tailed binder · Perineum = T-binder · Triangular = arm sling</text>
  </g>
</svg>
