<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="DejaVu Sans, Arial">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#90caf9"/></linearGradient>
    <linearGradient id="plunger" x1="0" x2="1"><stop offset="0" stop-color="#78909c"/><stop offset=".4" stop-color="#eceff1"/><stop offset="1" stop-color="#546e7a"/></linearGradient>
    <linearGradient id="liquid" x1="0" x2="1"><stop offset="0" stop-color="#1e88e5"/><stop offset=".4" stop-color="#64b5f6"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="therm" x1="0" x2="1"><stop offset="0" stop-color="#cfd8dc"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#90a4ae"/></linearGradient>
    <radialGradient id="bulb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ff8a80"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#7f0000"/></radialGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c6bc0"/><stop offset=".5" stop-color="#3949ab"/><stop offset="1" stop-color="#1a237e"/></linearGradient>
    <radialGradient id="gauge" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".8" stop-color="#eceff1"/><stop offset="1" stop-color="#90a4ae"/></radialGradient>
    <linearGradient id="bottle" x1="0" x2="1"><stop offset="0" stop-color="#bf6b1f"/><stop offset=".35" stop-color="#f6a54a"/><stop offset="1" stop-color="#7a3d0b"/></linearGradient>
    <linearGradient id="cap" x1="0" x2="1"><stop offset="0" stop-color="#e0e0e0"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#9e9e9e"/></linearGradient>
    <radialGradient id="pillA" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#26a69a"/></radialGradient>
    <radialGradient id="pillB" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ec407a"/></radialGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef5350"/><stop offset="1" stop-color="#b71c1c"/></linearGradient>
    <linearGradient id="kitTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e53935"/></linearGradient>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="5" dy="10" stdDeviation="8" flood-opacity=".35"/></filter>
  </defs>
  <circle cx="300" cy="215" r="205" fill="url(#glow)"/>
  <!-- first-aid kit (3D box) -->
  <g transform="translate(205,170)" filter="url(#s)">
    <path d="M0 40 L60 0 L250 0 L190 40 Z" fill="url(#kitTop)"/>
    <path d="M190 40 L250 0 L250 150 L190 190 Z" fill="#8e1414"/>
    <rect x="0" y="40" width="190" height="150" rx="6" fill="url(#kit)"/>
    
    <rect x="75" y="85" width="40" height="80" rx="5" fill="#fff"/><rect x="55" y="105" width="80" height="40" rx="5" fill="#fff"/>
    <rect x="0" y="40" width="190" height="14" fill="#ffffff" opacity=".18"/>
  </g>
  <!-- syringe -->
  <g transform="translate(60,170) rotate(-28)" filter="url(#s)">
    <rect x="0" y="22" width="40" height="16" rx="3" fill="url(#plunger)"/>
    <rect x="36" y="26" width="60" height="8" fill="url(#plunger)"/>
    <rect x="92" y="10" width="10" height="40" rx="3" fill="#90a4ae"/>
    <rect x="100" y="14" width="160" height="32" rx="6" fill="url(#glass)" stroke="#78909c" stroke-width="2"/>
    <rect x="170" y="17" width="88" height="26" rx="4" fill="url(#liquid)" opacity=".85"/>
    <g stroke="#455a64" stroke-width="2"><line x1="130" y1="14" x2="130" y2="24"/><line x1="160" y1="14" x2="160" y2="24"/><line x1="190" y1="14" x2="190" y2="24"/><line x1="220" y1="14" x2="220" y2="24"/></g>
    <path d="M260 22 L280 26 L280 34 L260 38 Z" fill="#b0bec5"/>
    <path d="M280 29 L340 30" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
    <rect x="104" y="17" width="150" height="5" rx="2" fill="#fff" opacity=".8"/>
  </g>
  <!-- thermometer -->
  <g transform="translate(470,50) rotate(25)" filter="url(#s)">
    <rect x="0" y="0" width="26" height="200" rx="13" fill="url(#therm)" stroke="#90a4ae" stroke-width="2"/>
    <rect x="9" y="70" width="8" height="140" rx="4" fill="#e53935"/>
    <circle cx="13" cy="215" r="20" fill="url(#bulb)"/>
    <g stroke="#546e7a" stroke-width="1.5"><line x1="18" y1="30" x2="24" y2="30"/><line x1="18" y1="50" x2="24" y2="50"/><line x1="18" y1="70" x2="24" y2="70"/><line x1="18" y1="90" x2="24" y2="90"/><line x1="18" y1="110" x2="24" y2="110"/></g>
    <rect x="4" y="6" width="5" height="190" rx="2.5" fill="#fff" opacity=".8"/>
  </g>
  <!-- BP apparatus -->
  <g transform="translate(40,250)" filter="url(#s)">
    <path d="M0 30 Q0 0 30 0 L150 0 Q180 0 180 30 L180 70 Q180 100 150 100 L30 100 Q0 100 0 70 Z" fill="url(#cuff)"/>
    <path d="M10 20 L170 20" stroke="#fff" stroke-width="3" opacity=".3"/>
    <path d="M180 60 Q230 60 230 110" stroke="#212121" stroke-width="7" fill="none"/>
    <circle cx="90" cy="50" r="38" fill="url(#gauge)" stroke="#455a64" stroke-width="5"/>
    <g stroke="#263238" stroke-width="2"><line x1="90" y1="18" x2="90" y2="26"/><line x1="122" y1="50" x2="114" y2="50"/><line x1="58" y1="50" x2="66" y2="50"/><line x1="113" y1="27" x2="107" y2="33"/><line x1="67" y1="27" x2="73" y2="33"/></g>
    <line x1="90" y1="50" x2="112" y2="32" stroke="#d50000" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="50" r="5" fill="#263238"/>
    <ellipse cx="236" cy="128" rx="22" ry="30" fill="#263238"/><ellipse cx="230" cy="118" rx="7" ry="12" fill="#fff" opacity=".25"/>
  </g>
  <!-- pill bottle -->
  <g transform="translate(470,250)" filter="url(#s)">
    <rect x="0" y="0" width="80" height="26" rx="5" fill="url(#cap)"/>
    <rect x="5" y="26" width="70" height="110" rx="10" fill="url(#bottle)"/>
    <rect x="10" y="55" width="60" height="50" rx="4" fill="#fffde7"/>
    <text x="40" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Rx</text>
    <rect x="12" y="30" width="8" height="100" rx="4" fill="#fff" opacity=".35"/>
  </g>
  <g filter="url(#s)">
    <rect x="390" y="370" width="70" height="28" rx="14" fill="url(#pillA)" transform="rotate(-20 425 384)"/>
    <ellipse cx="365" cy="395" rx="20" ry="13" fill="url(#pillB)"/>
    <circle cx="560" cy="210" r="14" fill="url(#pillA)"/>
    <path d="M30 40 h14 v-14 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 Z" fill="#43a047"/>
  </g>
</svg>
