  <text x="340" y="494" text-anchor="middle" font-size="12" fill="#1a237e">Pulse 2–3 fingers (index + middle) se lo – <tspan font-weight="bold">thumb se NAHI</tspan> (thumb ki apni pulse hoti hai)</text><text x="340" y="512" text-anchor="middle" font-size="12" fill="#1a237e">Regular pulse – 30 sec × 2 · Irregular pulse / first time / digoxin – full 1 minute</text>
