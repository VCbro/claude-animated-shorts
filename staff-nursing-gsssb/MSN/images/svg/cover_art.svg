<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="DejaVu Sans, Arial">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ht" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ff8a80"/><stop offset="0.55" stop-color="#e53935"/><stop offset="1" stop-color="#7f0000"/></radialGradient>
    <radialGradient id="pill1" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#26a69a"/></radialGradient>
    <radialGradient id="pill2" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffb300"/></radialGradient>
    <linearGradient id="clip" x1="0" x2="1"><stop offset="0" stop-color="#8d6e63"/><stop offset="1" stop-color="#5d4037"/></linearGradient>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="4" dy="8" stdDeviation="7" flood-opacity="0.35"/></filter>
  </defs>
  <circle cx="300" cy="210" r="200" fill="url(#glow)"/>
  <!-- clipboard -->
  <g transform="translate(330,70) rotate(8)" filter="url(#s)">
    <rect width="190" height="250" rx="14" fill="url(#clip)"/>
    <rect x="14" y="26" width="162" height="210" rx="6" fill="#fff"/>
    <rect x="60" y="8" width="70" height="28" rx="8" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
    <g stroke="#90a4ae" stroke-width="5" stroke-linecap="round"><line x1="34" y1="70" x2="150" y2="70"/><line x1="34" y1="95" x2="140" y2="95"/><line x1="34" y1="120" x2="150" y2="120"/><line x1="34" y1="145" x2="120" y2="145"/></g>
    <path d="M30 190 L60 190 L72 170 L86 215 L98 180 L108 190 L160 190" stroke="#e53935" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
  <!-- 3D heart -->
  <g transform="translate(110,120)" filter="url(#s)">
    <path d="M100 180 C20 120 0 70 30 35 C60 0 100 20 100 50 C100 20 140 0 170 35 C200 70 180 120 100 180 Z" fill="url(#ht)"/>
    <ellipse cx="62" cy="55" rx="22" ry="12" fill="#fff" opacity="0.45" transform="rotate(-35 62 55)"/>
    <path d="M40 100 L75 100 L85 80 L100 125 L112 92 L120 100 L160 100" stroke="#fff" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- stethoscope -->
  <path d="M90 60 Q60 160 140 300 Q170 350 230 345" stroke="#263238" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#s)"/>
  <circle cx="240" cy="345" r="22" fill="#cfd8dc" stroke="#263238" stroke-width="6" filter="url(#s)"/>
  <circle cx="240" cy="345" r="10" fill="#90a4ae"/>
  <!-- pills -->
  <g filter="url(#s)">
    <rect x="420" y="320" width="80" height="34" rx="17" fill="url(#pill1)" transform="rotate(-25 460 337)"/>
    <rect x="60" y="340" width="70" height="30" rx="15" fill="url(#pill2)" transform="rotate(20 95 355)"/>
    <circle cx="530" cy="90" r="20" fill="url(#pill2)"/>
  </g>
  <!-- plus signs -->
  <g fill="#ffffff" opacity="0.95" filter="url(#s)">
    <path d="M40 40 h14 v-14 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 Z" fill="#e53935"/>
    <path d="M540 230 h10 v-10 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 Z" fill="#43a047"/>
  </g>
</svg>
