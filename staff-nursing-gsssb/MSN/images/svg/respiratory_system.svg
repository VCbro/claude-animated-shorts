<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="DejaVu Sans, Arial" font-size="13">
  <defs>
    <radialGradient id="lung" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffd6dc"/><stop offset="0.6" stop-color="#f48fb1"/><stop offset="1" stop-color="#ad3a64"/></radialGradient>
    <linearGradient id="tr" x1="0" x2="1"><stop offset="0" stop-color="#cfd8dc"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#90a4ae"/></linearGradient>
    <radialGradient id="alv" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f06292"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="640" height="470" fill="#f4fbff"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#ad1457">Respiratory System – Lungs, Bronchi &amp; Alveoli</text>
  <!-- trachea -->
  <rect x="200" y="50" width="40" height="120" rx="10" fill="url(#tr)" stroke="#546e7a" stroke-width="2"/>
  <g stroke="#78909c" stroke-width="3"><line x1="202" y1="70" x2="238" y2="70"/><line x1="202" y1="88" x2="238" y2="88"/><line x1="202" y1="106" x2="238" y2="106"/><line x1="202" y1="124" x2="238" y2="124"/><line x1="202" y1="142" x2="238" y2="142"/></g>
  <!-- lungs -->
  <path d="M195 175 Q120 150 80 260 Q60 380 110 420 Q170 440 205 400 Q215 300 210 190 Z" fill="url(#lung)" stroke="#880e4f" stroke-width="2.5" filter="url(#s)"/>
  <path d="M245 175 Q320 150 360 260 Q380 380 330 420 Q290 435 270 410 Q285 395 255 380 Q235 300 230 190 Z" fill="url(#lung)" stroke="#880e4f" stroke-width="2.5" filter="url(#s)"/>
  <!-- fissures -->
  <path d="M95 300 Q150 270 205 250" stroke="#880e4f" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M85 350 Q150 320 205 330" stroke="#880e4f" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M355 330 Q300 300 240 250" stroke="#880e4f" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <!-- bronchi -->
  <g fill="none" stroke="#eceff1" stroke-width="9" stroke-linecap="round">
    <path d="M220 168 L170 215 L140 260"/><path d="M170 215 L150 320"/><path d="M220 168 L270 220 L300 280"/><path d="M270 220 L300 340"/>
  </g>
  <g fill="none" stroke="#90a4ae" stroke-width="2" stroke-linecap="round">
    <path d="M220 168 L170 215 L140 260"/><path d="M170 215 L150 320"/><path d="M220 168 L270 220 L300 280"/><path d="M270 220 L300 340"/>
  </g>
  <!-- diaphragm -->
  <path d="M60 440 Q220 380 380 440" stroke="#6d4c41" stroke-width="7" fill="none"/>
  <!-- labels -->
  <g font-size="12.5">
    <line x1="240" y1="80" x2="300" y2="70" stroke="#555"/><text x="305" y="66">Trachea (C-shaped</text><text x="305" y="80">cartilage rings)</text>
    <line x1="220" y1="168" x2="300" y2="150" stroke="#555"/><text x="305" y="148">Carina (T4-T5)</text>
    <text x="20" y="70" fill="#880e4f" font-weight="bold">Right lung</text><text x="20" y="85">3 lobes, 2 fissures</text><text x="20" y="100" fill="#555">Right bronchus: short,</text><text x="20" y="114" fill="#555">wide, vertical →</text><text x="20" y="128" fill="#c62828">aspiration yahan!</text>
    <text x="380" y="200" fill="#880e4f" font-weight="bold">Left lung</text><text x="380" y="215">2 lobes, 1 fissure</text><text x="380" y="230">Cardiac notch</text>
    <text x="40" y="462" fill="#6d4c41" font-weight="bold">Diaphragm (main muscle of inspiration)</text>
  </g>
  <!-- alveolus zoom -->
  <g transform="translate(465,270)">
    <circle cx="70" cy="70" r="80" fill="#fff" stroke="#ad1457" stroke-width="2" filter="url(#s)"/>
    <circle cx="45" cy="55" r="24" fill="url(#alv)" stroke="#ad1457"/>
    <circle cx="90" cy="50" r="22" fill="url(#alv)" stroke="#ad1457"/>
    <circle cx="70" cy="92" r="24" fill="url(#alv)" stroke="#ad1457"/>
    <path d="M10 110 Q70 140 130 100" stroke="#e53935" stroke-width="5" fill="none"/>
    <path d="M10 25 Q70 0 130 30" stroke="#1e88e5" stroke-width="5" fill="none"/>
    <text x="-15" y="-20" font-weight="bold" fill="#ad1457">Alveoli (gas exchange)</text>
    <text x="0" y="168" font-size="11.5">O₂ → blood · CO₂ → alveoli</text>
    <text x="0" y="183" font-size="11.5" fill="#555">Surfactant – Type II cells</text>
  </g>
  <line x1="300" y1="330" x2="470" y2="330" stroke="#ad1457" stroke-dasharray="4 4"/>
</svg>
