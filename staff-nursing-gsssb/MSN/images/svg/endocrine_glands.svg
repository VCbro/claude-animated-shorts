<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#d1c4e9"/><stop offset="0.5" stop-color="#f3eefc"/><stop offset="1" stop-color="#b39ddb"/></linearGradient>
    <radialGradient id="gl" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ff7043"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="680" height="520" fill="#fbf9ff"/>
  <text x="340" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#4527a0">Endocrine Glands &amp; Hormones</text>
  <g filter="url(#s)" stroke="#7e57c2" stroke-width="2" fill="url(#body)">
    <circle cx="340" cy="95" r="45"/>
    <rect x="325" y="135" width="30" height="30"/>
    <path d="M270 165 Q340 155 410 165 L420 330 Q400 380 340 385 Q280 380 260 330 Z"/>
    <path d="M300 380 L290 500 L325 500 L340 400 L355 500 L390 500 L380 380 Z"/>
  </g>
  <g stroke="#bf360c" stroke-width="1.8">
    <ellipse cx="335" cy="85" rx="7" ry="6" fill="#ffca28"/>
    <ellipse cx="340" cy="105" rx="7" ry="6" fill="#ab47bc"/>
    <path d="M326 150 q14 12 28 0 l-3 10 q-11 6 -22 0 Z" fill="#26a69a"/>
    <circle cx="331" cy="149" r="2.6" fill="#ec407a"/><circle cx="349" cy="149" r="2.6" fill="#ec407a"/>
    <ellipse cx="340" cy="200" rx="14" ry="10" fill="#66bb6a"/>
    <path d="M300 290 l12 -14 l10 14 Z M358 290 l12 -14 l10 14 Z" fill="#ffa726"/>
    <ellipse cx="310" cy="300" rx="10" ry="16" fill="#8d6e63"/><ellipse cx="370" cy="300" rx="10" ry="16" fill="#8d6e63"/>
    <path d="M318 325 Q345 315 375 322 Q380 330 350 333 Q330 335 318 330 Z" fill="#fdd835"/>
    <ellipse cx="320" cy="372" rx="7" ry="5" fill="#f06292"/><ellipse cx="360" cy="372" rx="7" ry="5" fill="#f06292"/>
  </g>
  <g>
    <line x1="328" y1="85" x2="200" y2="58" stroke="#555"/><text x="15" y="50" font-weight="bold" fill="#f9a825">Hypothalamus</text><text x="15" y="64" fill="#555">Releasing hormones,</text><text x="15" y="78" fill="#555">ADH &amp; oxytocin banata</text>
    <line x1="333" y1="105" x2="200" y2="118" stroke="#555"/><text x="15" y="104" font-weight="bold" fill="#8e24aa">Pituitary (Master)</text><text x="15" y="118" fill="#555">Ant: GH, TSH, ACTH,</text><text x="15" y="132" fill="#555">FSH, LH, Prolactin</text><text x="15" y="146" fill="#555">Post: ADH, Oxytocin</text>
    <line x1="335" y1="158" x2="200" y2="190" stroke="#555"/><text x="15" y="180" font-weight="bold" fill="#00897b">Thyroid</text><text x="15" y="194" fill="#555">T3, T4 (metabolism)</text><text x="15" y="208" fill="#555">Calcitonin (↓ Ca)</text>
    <line x1="331" y1="149" x2="460" y2="140" stroke="#555"/><text x="465" y="136" font-weight="bold" fill="#d81b60">Parathyroid (4)</text><text x="465" y="150" fill="#555">PTH → ↑ serum Ca</text>
    <line x1="352" y1="200" x2="460" y2="200" stroke="#555"/><text x="465" y="196" font-weight="bold" fill="#43a047">Thymus</text><text x="465" y="210" fill="#555">T-cell maturation</text>
    <line x1="372" y1="282" x2="460" y2="265" stroke="#555"/><text x="465" y="252" font-weight="bold" fill="#ef6c00">Adrenal</text><text x="465" y="266" fill="#555">Cortex: Cortisol, Aldosterone,</text><text x="465" y="280" fill="#555">Androgens · Medulla:</text><text x="465" y="294" fill="#555">Adrenaline, Noradrenaline</text>
    <line x1="318" y1="328" x2="200" y2="318" stroke="#555"/><text x="15" y="300" font-weight="bold" fill="#f9a825">Pancreas (Islets)</text><text x="15" y="314" fill="#555">α → Glucagon (↑ sugar)</text><text x="15" y="328" fill="#555">β → Insulin (↓ sugar)</text><text x="15" y="342" fill="#555">δ → Somatostatin</text>
    <line x1="362" y1="372" x2="460" y2="380" stroke="#555"/><text x="465" y="376" font-weight="bold" fill="#e91e63">Gonads</text><text x="465" y="390" fill="#555">Ovary: Estrogen, Progesterone</text><text x="465" y="404" fill="#555">Testis: Testosterone</text>
  </g>
  <text x="15" y="430" font-size="12" fill="#4527a0" font-weight="bold">Pineal gland → Melatonin (sleep cycle)</text>
  <text x="15" y="448" font-size="12" fill="#4527a0" font-weight="bold">Kidney → Erythropoietin, Renin</text>
</svg>
