<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="DejaVu Sans, Arial" font-size="12.5">
  <defs>
    <radialGradient id="pin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe0cc"/><stop offset="1" stop-color="#e0a07a"/></radialGradient>
    <radialGradient id="coch" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e1bee7"/><stop offset="1" stop-color="#8e24aa"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="660" height="380" fill="#fffaf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#6a1b9a">Ear – External, Middle &amp; Inner</text>
  <rect x="20" y="50" width="250" height="250" fill="#fff3e0" rx="10"/><rect x="270" y="50" width="140" height="250" fill="#e3f2fd" rx="10"/><rect x="410" y="50" width="230" height="250" fill="#f3e5f5" rx="10"/>
  <g font-weight="bold" font-size="13"><text x="80" y="70" fill="#e65100">EXTERNAL</text><text x="295" y="70" fill="#1565c0">MIDDLE</text><text x="490" y="70" fill="#6a1b9a">INNER</text></g>
  <path d="M70 90 Q20 140 60 200 Q80 250 120 260 Q100 200 110 170 Q140 120 110 90 Z" fill="url(#pin)" stroke="#a1664a" stroke-width="2" filter="url(#s)"/>
  <path d="M110 170 L265 170 L265 196 L110 196 Z" fill="#ffd8bf" stroke="#a1664a" stroke-width="2"/>
  <path d="M268 145 Q278 183 268 222" stroke="#c62828" stroke-width="6" fill="none"/>
  <g stroke="#5d4037" stroke-width="2" fill="#d7ccc8" filter="url(#s)">
    <path d="M274 170 L300 160 L306 175 Z"/><path d="M306 165 L335 150 L338 168 Z"/><path d="M338 160 L370 170 L360 185 L372 192 L360 196 Z"/>
  </g>
  <path d="M285 215 L295 290" stroke="#90caf9" stroke-width="10"/>
