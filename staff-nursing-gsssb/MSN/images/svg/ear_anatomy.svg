    <path d="M440 120 q20 -40 50 -20 q20 20 -5 35 M450 140 q-20 -40 10 -50" fill="none" stroke="#26a69a" stroke-width="6"/>
    <circle cx="520" cy="200" r="38" fill="url(#coch)" stroke="#4a148c" stroke-width="2"/>
    <path d="M520 200 m-26 0 a26 26 0 1 1 26 26 a18 18 0 1 1 -18 -18 a10 10 0 1 1 10 10" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M420 180 L480 190" stroke="#8d6e63" stroke-width="12"/>
    <path d="M556 190 L625 175" stroke="#ffb300" stroke-width="8"/>
  </g>
  <g font-size="11.5">
    <text x="30" y="285">Pinna + External auditory</text><text x="30" y="299">canal (2.5 cm, S-shaped)</text>
    <line x1="268" y1="150" x2="240" y2="130" stroke="#555"/><text x="160" y="108" fill="#c62828" font-weight="bold">Tympanic</text><text x="160" y="122" fill="#c62828" font-weight="bold">membrane</text><text x="160" y="136" fill="#555">(ear drum)</text>
    <text x="282" y="92">Ossicles:</text><text x="282" y="106" fill="#5d4037" font-weight="bold">Malleus → Incus</text><text x="282" y="120" fill="#5d4037" font-weight="bold">→ Stapes</text>
    <text x="308" y="240" fill="#1565c0">Eustachian</text><text x="308" y="254" fill="#1565c0">tube →</text><text x="308" y="268" fill="#1565c0">nasopharynx</text><text x="308" y="282" fill="#555">(pressure =)</text>
    <text x="500" y="100" fill="#00796b" font-weight="bold">Semicircular canals</text><text x="500" y="114" fill="#555">= Balance (equilibrium)</text>
    <text x="470" y="258" fill="#6a1b9a" font-weight="bold">Cochlea = Hearing</text><text x="470" y="272" fill="#555">Organ of Corti</text>
    <text x="560" y="160" fill="#ff8f00">CN VIII</text>
  </g>
  <text x="20" y="325" font-size="12" fill="#c62828">Stapes = body ki sabse chhoti haddi · Ear drops adult: pinna UP &amp; BACK · Child (&lt;3 yr): DOWN &amp; BACK</text>
  <text x="20" y="345" font-size="12" fill="#1565c0">Bachchon me Eustachian tube chhoti, seedhi, chaudi → Otitis media zyada</text>
</svg>
