<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="DejaVu Sans, Arial" font-size="13">
  <defs>
    <radialGradient id="red3d" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff8a80"/><stop offset="0.6" stop-color="#e53935"/><stop offset="1" stop-color="#8e1414"/></radialGradient>
    <radialGradient id="blue3d" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#90caf9"/><stop offset="0.6" stop-color="#3f7fd6"/><stop offset="1" stop-color="#173f80"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#222"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fffaf2"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">Heart – Chambers, Valves &amp; Blood Flow</text>
  <!-- vessels -->
  <rect x="230" y="50" width="46" height="110" rx="20" fill="url(#blue3d)" stroke="#0d2a5c" stroke-width="2"/>
  <path d="M300 150 Q300 60 360 60 Q430 60 440 120" fill="none" stroke="url(#red3d)" stroke-width="40" stroke-linecap="round" filter="url(#s)"/>
  <path d="M330 150 Q320 95 260 95 Q200 95 170 120" fill="none" stroke="#3f7fd6" stroke-width="30" stroke-linecap="round"/>
  <rect x="220" y="370" width="44" height="80" rx="18" fill="url(#blue3d)" stroke="#0d2a5c" stroke-width="2"/>
  <!-- heart body -->
  <path d="M200 160 Q170 260 220 340 Q280 430 340 455 Q420 410 460 320 Q500 220 450 160 Q330 120 200 160 Z" fill="#f8d7d0" stroke="#7b1f1f" stroke-width="3" filter="url(#s)"/>
  <!-- RA -->
  <path d="M205 165 Q185 230 215 280 L300 270 L300 165 Z" fill="url(#blue3d)" stroke="#0d2a5c" stroke-width="2"/>
  <!-- RV -->
  <path d="M215 290 Q240 380 330 440 L330 300 L300 285 Z" fill="url(#blue3d)" stroke="#0d2a5c" stroke-width="2"/>
  <!-- LA -->
  <path d="M340 165 L445 165 Q470 210 450 255 L340 260 Z" fill="url(#red3d)" stroke="#5c0d0d" stroke-width="2"/>
  <!-- LV -->
  <path d="M345 275 L452 270 Q455 360 345 440 Z" fill="url(#red3d)" stroke="#5c0d0d" stroke-width="2"/>
  <!-- septum -->
  <path d="M320 165 L322 445" stroke="#7b1f1f" stroke-width="10"/>
  <!-- valves -->
  <g stroke="#ffd54f" stroke-width="6" stroke-linecap="round">
    <line x1="232" y1="283" x2="296" y2="278"/>
    <line x1="350" y1="266" x2="440" y2="263"/>
    <line x1="292" y1="168" x2="312" y2="152"/>
    <line x1="336" y1="160" x2="358" y2="172"/>
  </g>
  <g font-weight="bold" fill="#fff" font-size="15" text-anchor="middle">
    <text x="255" y="225">RA</text><text x="280" y="355">RV</text>
    <text x="395" y="215">LA</text><text x="395" y="345">LV</text>
  </g>
  <!-- flow arrows -->
  <g stroke="#222" stroke-width="2.4" fill="none" marker-end="url(#ar)">
    <path d="M253 120 L253 190"/>
    <path d="M243 410 L248 330"/>
    <path d="M262 240 L265 300"/>
    <path d="M290 330 L305 190"/>
    <path d="M395 228 L398 300"/>
    <path d="M380 380 L360 190"/>
  </g>
  <!-- labels -->
  <g font-size="12.5" fill="#222">
    <line x1="230" y1="70" x2="120" y2="60" stroke="#555"/><text x="20" y="58">Superior Vena Cava</text>
    <line x1="220" y1="420" x2="120" y2="440" stroke="#555"/><text x="15" y="445">Inferior Vena Cava</text>
    <text x="10" y="112">Pulmonary Artery</text><text x="10" y="126" fill="#1565c0">(impure → lungs)</text>
    <line x1="440" y1="85" x2="500" y2="70" stroke="#555"/><text x="505" y="66">Aorta</text><text x="505" y="80" fill="#c62828">(pure → body)</text>
    <line x1="264" y1="281" x2="120" y2="290" stroke="#555"/><text x="10" y="282">Tricuspid valve</text><text x="10" y="296" fill="#666">(3 cusps)</text>
    <line x1="440" y1="263" x2="505" y2="258" stroke="#555"/><text x="505" y="254">Mitral/Bicuspid</text><text x="505" y="268" fill="#666">(2 cusps)</text>
    <line x1="302" y1="160" x2="200" y2="148" stroke="#555"/><text x="98" y="160" fill="#555">Pulmonary valve</text>
    <line x1="350" y1="166" x2="500" y2="140" stroke="#555"/><text x="505" y="140">Aortic valve</text>
    <line x1="455" y1="215" x2="505" y2="205" stroke="#555"/><text x="505" y="200">Pulmonary veins</text><text x="505" y="214" fill="#c62828">(pure from lungs)</text>
    <line x1="322" y1="400" x2="505" y2="400" stroke="#555"/><text x="505" y="396">Inter-ventricular</text><text x="505" y="410">septum</text>
  </g>
  <rect x="20" y="455" width="14" height="14" fill="#3f7fd6"/><text x="40" y="467" font-size="12">Deoxygenated</text>
  <rect x="140" y="455" width="14" height="14" fill="#e53935"/><text x="160" y="467" font-size="12">Oxygenated</text>
  <rect x="250" y="455" width="14" height="14" fill="#ffd54f"/><text x="270" y="467" font-size="12">Valves</text>
</svg>
