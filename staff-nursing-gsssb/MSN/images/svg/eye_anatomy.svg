<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="DejaVu Sans, Arial" font-size="12.5">
  <defs>
    <radialGradient id="eye" cx="40%" cy="40%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.8" stop-color="#eef3f7"/><stop offset="1" stop-color="#b0bec5"/></radialGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#90caf9"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="660" height="400" fill="#f5fbff"/>
  <text x="330" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#01579b">Eye – Cross Section</text>
  <g transform="translate(330,210)">
    <circle r="140" fill="url(#eye)" stroke="#78909c" stroke-width="6" filter="url(#s)"/>
    <circle r="132" fill="none" stroke="#c62828" stroke-width="5" stroke-dasharray="1 0"/>
    <path d="M-120 -64 A136 136 0 0 0 -120 64" fill="none" stroke="#f5fbff" stroke-width="16"/>
    <path d="M-128 -60 Q-175 0 -128 60" fill="#e1f5fe" stroke="#0288d1" stroke-width="3"/>
    <path d="M-118 -62 L-112 -24 M-118 62 L-112 24" stroke="#5d4037" stroke-width="9"/>
    <ellipse cx="-100" cy="0" rx="16" ry="32" fill="url(#lens)" stroke="#1565c0" stroke-width="2"/>
    <path d="M-106 -35 L-88 -60 M-106 35 L-88 60" stroke="#8d6e63" stroke-width="4"/>
    <circle cx="132" cy="0" r="7" fill="#fbc02d"/>
    <path d="M138 25 L220 50" stroke="#ffb300" stroke-width="14"/>
    <circle cx="131" cy="28" r="6" fill="#fff" stroke="#999"/>
  </g>
  <g>
    <line x1="182" y1="200" x2="178" y2="114" stroke="#555"/><text x="15" y="96" font-weight="bold" fill="#0288d1">Cornea</text><text x="15" y="110" fill="#555">transparent, avascular</text>
    <line x1="215" y1="160" x2="90" y2="160" stroke="#555"/><text x="15" y="156" font-weight="bold" fill="#5d4037">Iris</text><text x="15" y="170" fill="#555">pupil size control</text>
    <line x1="220" y1="215" x2="90" y2="230" stroke="#555"/><text x="15" y="226" font-weight="bold" fill="#1565c0">Lens</text><text x="15" y="240" fill="#c62828">opaque = Cataract</text>
    <line x1="200" y1="190" x2="140" y2="284" stroke="#555"/><text x="15" y="296" font-weight="bold" fill="#00838f">Aqueous humour</text><text x="15" y="310" fill="#555">anterior chamber;</text><text x="15" y="324" fill="#c62828">drainage block = Glaucoma</text>
    <line x1="235" y1="250" x2="140" y2="365" stroke="#555"/><text x="15" y="370" font-weight="bold" fill="#6d4c41">Ciliary body</text><text x="15" y="384" fill="#555">aqueous banata, accommodation</text>
    <line x1="420" y1="110" x2="500" y2="70" stroke="#555"/><text x="505" y="66" font-weight="bold" fill="#607d8b">Sclera</text><text x="505" y="80" fill="#555">white outer coat</text>
    <line x1="455" y1="140" x2="500" y2="115" stroke="#555"/><text x="505" y="112" font-weight="bold" fill="#c62828">Retina</text><text x="505" y="126" fill="#555">rods + cones</text><text x="505" y="140" fill="#c62828">detach = curtain vision</text>
    <line x1="462" y1="210" x2="520" y2="195" stroke="#555"/><text x="525" y="190" font-weight="bold" fill="#f9a825">Macula/Fovea</text><text x="525" y="204" fill="#555">sharpest vision</text>
    <line x1="461" y1="238" x2="520" y2="232" stroke="#555"/><text x="525" y="230" font-weight="bold" fill="#424242">Optic disc</text><text x="525" y="244" fill="#555">= Blind spot</text>
    <text x="505" y="292" font-weight="bold" fill="#ff8f00">Optic nerve (CN II)</text>
    <text x="330" y="215" text-anchor="middle" font-weight="bold" fill="#78909c">Vitreous humour</text><text x="330" y="230" text-anchor="middle" fill="#90a4ae">(jelly – shape maintain)</text>
  </g>
</svg>
