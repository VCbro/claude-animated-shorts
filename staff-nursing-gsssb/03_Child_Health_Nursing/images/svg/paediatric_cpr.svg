<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <radialGradient id="sk" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffeadf"/><stop offset="1" stop-color="#d79470"/></radialGradient>
    <radialGradient id="hd" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd8c2"/><stop offset="1" stop-color="#b9714d"/></radialGradient>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#b71c1c"/><stop offset="1" stop-color="#ef5350"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="440" fill="#fffafa"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">Paediatric CPR (BLS) – Infant vs Child</text>
  <!-- infant two-thumb -->
  <g filter="url(#s)"><rect x="20" y="45" width="410" height="250" rx="14" fill="#fff" stroke="#ef9a9a" stroke-width="2"/><rect x="450" y="45" width="410" height="250" rx="14" fill="#fff" stroke="#90caf9" stroke-width="2"/></g>
  <g transform="translate(140,180)" filter="url(#s)">
    <ellipse cx="-70" cy="0" rx="32" ry="30" fill="url(#sk)"/>
    <rect x="-42" y="-30" width="110" height="60" rx="28" fill="url(#sk)"/>
    <path d="M60 -20 l45 -10 M60 20 l45 10" stroke="url(#sk)" stroke-width="16" stroke-linecap="round"/>
    <path d="M-20 -30 l-10 -35 M-20 30 l-10 35" stroke="url(#sk)" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="2" cy="-12" rx="12" ry="7" fill="url(#hd)" stroke="#6d4c41"/>
    <ellipse cx="2" cy="12" rx="12" ry="7" fill="url(#hd)" stroke="#6d4c41"/>
    <path d="M-10 -55 Q2 -45 14 -55 M-10 55 Q2 45 14 55" stroke="#b9714d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-14 0 h40" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11.8">
    <text x="35" y="70" font-weight="bold" font-size="14.5" fill="#b71c1c">INFANT (&lt; 1 year)</text>
    <text x="270" y="100">Pulse: <tspan font-weight="bold">brachial</tspan></text>
    <text x="270" y="122">Site: just below</text>
    <text x="270" y="139">inter-nipple line</text>
    <text x="270" y="161">1 rescuer: 2 fingers</text>
    <text x="270" y="183">2 rescuers: <tspan font-weight="bold">2-thumb</tspan></text>
    <text x="270" y="200">encircling hands</text>
    <text x="270" y="222">Depth: <tspan font-weight="bold">4 cm (1½ in)</tspan></text>
    <text x="270" y="244">≈ 1/3 AP chest</text>
    <text x="35" y="280" fill="#455a64" font-size="11">Head neutral ("sniffing") · cover mouth + nose</text>
  </g>
  <!-- child -->
  <g transform="translate(560,185)" filter="url(#s)">
    <ellipse cx="-80" cy="0" rx="34" ry="32" fill="url(#sk)"/>
    <rect x="-48" y="-36" width="140" height="72" rx="30" fill="url(#sk)"/>
    <rect x="-5" y="-62" width="34" height="50" rx="10" fill="url(#hd)" stroke="#6d4c41"/>
    <rect x="-8" y="-20" width="40" height="20" rx="8" fill="url(#hd)" stroke="#6d4c41"/>
    <path d="M12 -60 L12 -110" stroke="url(#hd)" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g font-size="11.8">
    <text x="465" y="70" font-weight="bold" font-size="14.5" fill="#0d47a1">CHILD (1 yr – puberty)</text>
    <text x="700" y="100">Pulse: <tspan font-weight="bold">carotid/</tspan></text>
    <text x="700" y="117"><tspan font-weight="bold">femoral</tspan></text>
    <text x="700" y="139">Site: lower half</text>
    <text x="700" y="156">of sternum</text>
    <text x="700" y="178">1 or 2 hands</text>
    <text x="700" y="200">(heel of hand)</text>
    <text x="700" y="222">Depth: <tspan font-weight="bold">5 cm (2 in)</tspan></text>
    <text x="700" y="244">≈ 1/3 AP chest</text>
    <text x="465" y="280" fill="#455a64" font-size="11">Head tilt – chin lift · mouth-to-mouth</text>
  </g>
  <g filter="url(#s)"><rect x="20" y="310" width="840" height="118" rx="14" fill="url(#r)"/></g>
  <g fill="#fff" font-size="12.5">
    <text x="40" y="338" font-weight="bold" font-size="14">Common to both (AHA)</text>
    <text x="40" y="362">Rate <tspan font-weight="bold">100–120/min</tspan> · full chest recoil · minimal interruptions · sequence <tspan font-weight="bold">C-A-B</tspan></text>
    <text x="40" y="385">Ratio: <tspan font-weight="bold">30 : 2</tspan> (single rescuer) · <tspan font-weight="bold">15 : 2</tspan> (two rescuers) · Newborn: <tspan font-weight="bold">3 : 1</tspan></text>
    <text x="40" y="408">Start CPR if HR &lt; 60 with poor perfusion · Adrenaline 0.01 mg/kg IV/IO · Defibrillation 2 J/kg → 4 J/kg</text>
  </g>
</svg>
