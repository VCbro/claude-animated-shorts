<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="red" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef9a9a"/><stop offset=".5" stop-color="#e53935"/><stop offset="1" stop-color="#8e0000"/></linearGradient>
    <linearGradient id="yel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff59d"/><stop offset=".5" stop-color="#fdd835"/><stop offset="1" stop-color="#c49000"/></linearGradient>
    <linearGradient id="grn" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a5d6a7"/><stop offset=".5" stop-color="#43a047"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
    <radialGradient id="arm" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3cf"/><stop offset="1" stop-color="#cf8a63"/></radialGradient>
    <radialGradient id="kw" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff0e4"/><stop offset="1" stop-color="#c98a65"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="860" height="430" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#bf360c">MUAC Tape &amp; Malnutrition (6–59 months)</text>
  <!-- tape -->
  <g filter="url(#s)">
    <rect x="40" y="60" width="300" height="46" rx="6" fill="url(#red)"/>
    <rect x="340" y="60" width="90" height="46" fill="url(#yel)"/>
    <rect x="430" y="60" width="300" height="46" rx="6" fill="url(#grn)"/>
    <rect x="40" y="60" width="690" height="10" rx="5" fill="#fff" opacity=".35"/>
  </g>
  <g fill="#fff" font-weight="bold" font-size="14" text-anchor="middle">
    <text x="190" y="89">RED  &lt; 11.5 cm → SAM</text>
    <text x="385" y="82" fill="#3e2723" font-size="11">11.5–12.5</text><text x="385" y="97" fill="#3e2723" font-size="11">MAM</text>
    <text x="580" y="89">GREEN  ≥ 12.5 cm → Normal</text>
  </g>
  <!-- arm -->
  <g transform="translate(790,85)" filter="url(#s)">
    <rect x="-22" y="-40" width="44" height="88" rx="20" fill="url(#arm)"/>
    <rect x="-26" y="5" width="52" height="14" rx="4" fill="url(#grn)"/>
  </g>
  <!-- marasmus vs kwashiorkor -->
  <g filter="url(#s)">
    <rect x="30" y="140" width="390" height="185" rx="14" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
    <rect x="440" y="140" width="390" height="185" rx="14" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  </g>
  <!-- marasmic child -->
  <g transform="translate(95,232)" filter="url(#s)">
    <ellipse cx="0" cy="-48" rx="26" ry="28" fill="url(#arm)"/>
    <path d="M-12 -20 L-14 45 M12 -20 L14 45" stroke="url(#arm)" stroke-width="10" stroke-linecap="round"/>
    <path d="M-15 -18 Q0 -12 15 -18 L13 30 Q0 36 -13 30 Z" fill="url(#arm)"/>
    <path d="M-10 -5 h20 M-10 3 h20 M-10 11 h20" stroke="#a1664a" stroke-width="1.4"/>
    <circle cx="-9" cy="-52" r="3" fill="#3e2723"/><circle cx="9" cy="-52" r="3" fill="#3e2723"/>
    <path d="M-8 -36 q8 -5 16 0" stroke="#5d4037" stroke-width="2" fill="none"/>
    <path d="M-20 -60 q-4 8 0 16 M20 -60 q4 8 0 16" stroke="#a1664a" stroke-width="1.5" fill="none"/>
  </g>
  <g font-size="12">
    <text x="160" y="165" font-weight="bold" font-size="15" fill="#e65100">MARASMUS</text>
    <text x="160" y="188">Severe wasting – "skin &amp; bones"</text>
    <text x="160" y="208">"Old man / monkey" face</text>
    <text x="160" y="228"><tspan font-weight="bold">NO oedema</tspan> · alert, hungry</text>
    <text x="160" y="248">Weight &lt; 60 % of expected</text>
    <text x="160" y="268">Calorie (energy) deficiency</text>
    <text x="160" y="288">Usually &lt; 1 year</text>
  </g>
  <!-- kwashiorkor child -->
  <g transform="translate(505,232)" filter="url(#s)">
    <ellipse cx="0" cy="-48" rx="30" ry="29" fill="url(#kw)"/>
    <ellipse cx="0" cy="12" rx="26" ry="34" fill="url(#kw)"/>
    <path d="M-12 40 L-14 62 M12 40 L14 62" stroke="url(#kw)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-10" cy="-52" r="3" fill="#3e2723"/><circle cx="10" cy="-52" r="3" fill="#3e2723"/>
    <path d="M-8 -36 q8 4 16 0" stroke="#5d4037" stroke-width="2" fill="none"/>
    <path d="M-28 -66 Q0 -84 28 -66" stroke="#c8a165" stroke-width="7" fill="none"/>
    <circle cx="-14" cy="20" r="4" fill="#795548" opacity=".55"/><circle cx="12" cy="4" r="3" fill="#795548" opacity=".55"/>
  </g>
  <g font-size="12">
    <text x="570" y="165" font-weight="bold" font-size="15" fill="#0d47a1">KWASHIORKOR</text>
    <text x="570" y="188"><tspan font-weight="bold">Pitting oedema</tspan> (feet → face)</text>
    <text x="570" y="208">Moon face · apathy, irritable</text>
    <text x="570" y="228">Flaky-paint dermatosis</text>
    <text x="570" y="248">Flag sign / sparse pale hair</text>
    <text x="570" y="268">Fatty liver · protein deficiency</text>
    <text x="570" y="288">Usually 1–4 yrs (after weaning)</text>
  </g>
  <g font-size="12.3" fill="#263238">
    <text x="30" y="355"><tspan font-weight="bold" fill="#c62828">SAM (WHO):</tspan> WHZ &lt; −3 SD  OR  MUAC &lt; 11.5 cm  OR  bilateral pitting oedema → NRC (with complications)</text>
    <text x="30" y="378"><tspan font-weight="bold" fill="#f9a825">MAM:</tspan> WHZ −3 to −2 SD  or  MUAC 11.5–12.5 cm → supplementary nutrition (ICDS/ Anganwadi)</text>
    <text x="30" y="401"><tspan font-weight="bold" fill="#2e7d32">Therapeutic feeds:</tspan> F-75 (stabilisation, 75 kcal/100 ml) → F-100 (rehabilitation) · ReSoMal for dehydration</text>
  </g>
</svg>
