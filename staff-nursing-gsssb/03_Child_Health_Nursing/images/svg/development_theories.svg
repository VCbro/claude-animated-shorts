<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="s1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b3e5fc"/><stop offset="1" stop-color="#0288d1"/></linearGradient>
    <linearGradient id="s2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset="1" stop-color="#388e3c"/></linearGradient>
    <linearGradient id="s3" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff9c4"/><stop offset="1" stop-color="#f9a825"/></linearGradient>
    <linearGradient id="s4" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffccbc"/><stop offset="1" stop-color="#e64a19"/></linearGradient>
    <linearGradient id="s5" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9c4dcc"/><stop offset="1" stop-color="#7b1fa2"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="900" height="460" fill="#fcfcff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#311b92">Theories of Development – Age-wise Staircase</text>
  <g filter="url(#s)">
    <rect x="20" y="330" width="170" height="110" rx="10" fill="url(#s1)"/>
    <rect x="195" y="270" width="170" height="170" rx="10" fill="url(#s2)"/>
    <rect x="370" y="210" width="170" height="230" rx="10" fill="url(#s3)"/>
    <rect x="545" y="150" width="170" height="290" rx="10" fill="url(#s4)"/>
    <rect x="720" y="90" width="165" height="350" rx="10" fill="url(#s5)"/>
  </g>
  <g font-weight="bold" font-size="13.5" text-anchor="middle" fill="#1a237e">
    <text x="105" y="320">Infant 0–1 y</text><text x="280" y="260">Toddler 1–3 y</text><text x="455" y="200">Preschool 3–6 y</text><text x="630" y="140">School 6–12 y</text><text x="802" y="80">Adolescent 12–18 y</text>
  </g>
  <g font-size="11" fill="#102027">
    <text x="30" y="352" font-weight="bold">Erikson:</text><text x="30" y="368">Trust vs Mistrust</text>
    <text x="30" y="388" font-weight="bold">Freud:</text><text x="30" y="404">Oral</text>
    <text x="30" y="422" font-weight="bold">Piaget:</text><text x="88" y="422">Sensorimotor</text><text x="30" y="436">(0–2 y) object permanence</text>

    <text x="205" y="292" font-weight="bold">Erikson:</text><text x="205" y="308">Autonomy vs Shame</text><text x="205" y="322">&amp; Doubt</text>
    <text x="205" y="342" font-weight="bold">Freud:</text><text x="205" y="358">Anal (toilet training)</text>
    <text x="205" y="378" font-weight="bold">Piaget:</text><text x="205" y="394">Preoperational (2–7 y)</text>
    <text x="205" y="410">egocentric, magical</text><text x="205" y="424">thinking</text>

    <text x="380" y="232" font-weight="bold">Erikson:</text><text x="380" y="248">Initiative vs Guilt</text>
    <text x="380" y="268" font-weight="bold">Freud:</text><text x="380" y="284">Phallic (Oedipus/</text><text x="380" y="298">Electra complex)</text>
    <text x="380" y="318" font-weight="bold">Piaget:</text><text x="380" y="334">Preoperational</text>
    <text x="380" y="354" font-weight="bold">Play:</text><text x="380" y="370">Associative, dramatic</text>
    <text x="380" y="390">Fear: body mutilation</text>

    <text x="555" y="172" font-weight="bold">Erikson:</text><text x="555" y="188">Industry vs</text><text x="555" y="202">Inferiority</text>
    <text x="555" y="222" font-weight="bold">Freud:</text><text x="555" y="238">Latency</text>
    <text x="555" y="258" font-weight="bold">Piaget:</text><text x="555" y="274">Concrete operational</text><text x="555" y="288">(7–11 y) conservation,</text><text x="555" y="302">classification</text>
    <text x="555" y="322" font-weight="bold">Play:</text><text x="555" y="338">Cooperative, rules,</text><text x="555" y="352">team games</text>
    <text x="555" y="372">Kohlberg: conventional</text>

    <text x="730" y="112" font-weight="bold" fill="#fff">Erikson:</text><text x="730" y="128" fill="#fff">Identity vs Role</text><text x="730" y="142" fill="#fff">Confusion</text>
    <text x="730" y="162" font-weight="bold" fill="#fff">Freud:</text><text x="730" y="178" fill="#fff">Genital</text>
    <text x="730" y="198" font-weight="bold" fill="#fff">Piaget:</text><text x="730" y="214" fill="#fff">Formal operational</text><text x="730" y="228" fill="#fff">(11+ y) abstract</text><text x="730" y="242" fill="#fff">thinking</text>
    <text x="730" y="262" font-weight="bold" fill="#fff">Concerns:</text><text x="730" y="278" fill="#fff">body image, peers,</text><text x="730" y="292" fill="#fff">privacy</text>
    <text x="730" y="312" fill="#fff">Kohlberg: post-</text><text x="730" y="326" fill="#fff">conventional</text>
  </g>
  <g font-size="11.5" fill="#263238">
    <text x="20" y="70"><tspan font-weight="bold" fill="#311b92">Erikson</tspan> – psychosocial · <tspan font-weight="bold" fill="#311b92">Freud</tspan> – psychosexual</text>
    <text x="20" y="90"><tspan font-weight="bold" fill="#311b92">Piaget</tspan> – cognitive · <tspan font-weight="bold" fill="#311b92">Kohlberg</tspan> – moral</text>
    <text x="20" y="110"><tspan font-weight="bold" fill="#311b92">Play:</tspan> solitary (infant) → parallel</text>
    <text x="20" y="128">(toddler) → associative (preschool)</text>
    <text x="20" y="146">→ cooperative (school age)</text>
  </g>
</svg>
