<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="h" x1="0" x2="1"><stop offset="0" stop-color="#00695c"/><stop offset="1" stop-color="#26a69a"/></linearGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#4db6ac"/><stop offset="1" stop-color="#004d40"/></radialGradient>
    <linearGradient id="vial" x1="0" x2="1"><stop offset="0" stop-color="#b2dfdb"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#80cbc4"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="520" fill="#f7fffd"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#004d40">National Immunization Schedule (UIP) – Children</text>
  <g filter="url(#s)">
    <rect x="30" y="48" width="840" height="34" rx="10" fill="url(#h)"/>
  </g>
  <g fill="#fff" font-weight="bold" font-size="13">
    <text x="50" y="70">Age</text><text x="200" y="70">Vaccines</text><text x="640" y="70">Route / Site</text>
  </g>
  <g font-size="12.2">
    <g filter="url(#s)">
      <rect x="30" y="88" width="840" height="44" rx="8" fill="#ffffff" stroke="#b2dfdb"/>
      <rect x="30" y="138" width="840" height="44" rx="8" fill="#e0f2f1" stroke="#b2dfdb"/>
      <rect x="30" y="188" width="840" height="44" rx="8" fill="#ffffff" stroke="#b2dfdb"/>
      <rect x="30" y="238" width="840" height="44" rx="8" fill="#e0f2f1" stroke="#b2dfdb"/>
      <rect x="30" y="288" width="840" height="44" rx="8" fill="#ffffff" stroke="#b2dfdb"/>
      <rect x="30" y="338" width="840" height="44" rx="8" fill="#e0f2f1" stroke="#b2dfdb"/>
      <rect x="30" y="388" width="840" height="44" rx="8" fill="#ffffff" stroke="#b2dfdb"/>
    </g>
    <g font-weight="bold" fill="#00695c">
      <text x="45" y="115">Birth</text><text x="45" y="165">6 weeks</text><text x="45" y="215">10 weeks</text><text x="45" y="265">14 weeks</text>
      <text x="45" y="315">9–12 months</text><text x="45" y="365">16–24 months</text><text x="45" y="415">5–6 yrs · 10 · 16 yrs</text>
    </g>
    <text x="200" y="115">BCG · OPV-0 · Hepatitis B birth dose (within 24 hrs)</text>
    <text x="200" y="165">OPV-1 · Pentavalent-1 · Rotavirus-1 · fIPV-1 · PCV-1</text>
    <text x="200" y="215">OPV-2 · Pentavalent-2 · Rotavirus-2</text>
    <text x="200" y="265">OPV-3 · Pentavalent-3 · Rotavirus-3 · fIPV-2 · PCV-2</text>
    <text x="200" y="315">MR-1 · JE-1* · PCV booster · fIPV-3 · Vitamin A (1 lakh IU)</text>
    <text x="200" y="365">MR-2 · JE-2* · DPT booster-1 · OPV booster · Vitamin A (2 lakh IU)</text>
    <text x="200" y="415">DPT booster-2 (5–6 y) · Td (10 y) · Td (16 y)</text>
    <g fill="#37474f" font-size="11.2">
      <text x="640" y="108">BCG 0.1 ml ID L upper arm</text><text x="640" y="124">(0.05 ml if &lt; 1 month)</text>
      <text x="640" y="158">OPV 2 drops · RVV 5 drops oral</text><text x="640" y="174">Penta/PCV 0.5 ml IM thigh</text>
      <text x="640" y="215">Same as 6 weeks</text>
      <text x="640" y="258">fIPV 0.1 ml ID</text><text x="640" y="274">right upper arm</text>
      <text x="640" y="308">MR 0.5 ml SC right upper arm</text><text x="640" y="324">Vit A 1 ml (oral)</text>
      <text x="640" y="358">DPT 0.5 ml IM thigh</text><text x="640" y="374">Vit A 2 ml every 6 mo → 5 y</text>
      <text x="640" y="408">Td 0.5 ml IM</text><text x="640" y="424">upper arm</text>
    </g>
  </g>
  <g transform="translate(60,470)" filter="url(#s)">
    <rect x="-10" y="-22" width="22" height="40" rx="5" fill="url(#vial)" stroke="#00897b"/>
    <rect x="-8" y="-30" width="18" height="10" rx="2" fill="#e53935"/>
    <rect x="-6" y="-2" width="14" height="14" fill="#fff" stroke="#00695c"/><rect x="-2" y="2" width="6" height="6" fill="#b2dfdb"/>
  </g>
  <g font-size="11.5" fill="#263238">
    <text x="90" y="462"><tspan font-weight="bold" fill="#00695c">VVM:</tspan> inner square lighter than outer circle = USE · same/darker = DISCARD</text>
    <text x="90" y="480"><tspan font-weight="bold" fill="#00695c">Cold chain:</tspan> ILR +2 to +8 °C · Deep freezer −15 to −25 °C · *JE only in endemic districts</text>
    <text x="90" y="498"><tspan font-weight="bold" fill="#c62828">Vitamin A:</tspan> total 9 doses (9 months → 5 years) · Pentavalent = DPT + Hep B + Hib</text>
  </g>
</svg>
