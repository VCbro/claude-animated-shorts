<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <radialGradient id="t" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f5f5f5"/><stop offset="1" stop-color="#bdbdbd"/></radialGradient>
    <radialGradient id="gum" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ffcdd2"/><stop offset=".6" stop-color="#f06292"/><stop offset="1" stop-color="#ad1457"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="820" height="450" fill="#fffafc"/>
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#ad1457">Primary (Milk) Teeth – Eruption Sequence (20 teeth)</text>
  <!-- lower jaw arch -->
  <g transform="translate(240,205) scale(.88)">
    <path d="M-185 -90 Q-190 120 0 140 Q190 120 185 -90 L140 -90 Q140 85 0 95 Q-140 85 -140 -90 Z" fill="url(#gum)" filter="url(#s)"/>
    <g filter="url(#s)">
      <rect x="-26" y="88" width="22" height="30" rx="8" fill="url(#t)" stroke="#e53935" stroke-width="2.5"/>
      <rect x="4" y="88" width="22" height="30" rx="8" fill="url(#t)" stroke="#e53935" stroke-width="2.5"/>
      <rect x="-58" y="80" width="24" height="30" rx="8" fill="url(#t)" stroke="#fb8c00" stroke-width="2.5"/>
      <rect x="34" y="80" width="24" height="30" rx="8" fill="url(#t)" stroke="#fb8c00" stroke-width="2.5"/>
      <rect x="-92" y="62" width="26" height="30" rx="9" fill="url(#t)" stroke="#43a047" stroke-width="2.5"/>
      <rect x="66" y="62" width="26" height="30" rx="9" fill="url(#t)" stroke="#43a047" stroke-width="2.5"/>
      <rect x="-128" y="28" width="32" height="34" rx="9" fill="url(#t)" stroke="#1e88e5" stroke-width="2.5"/>
      <rect x="96" y="28" width="32" height="34" rx="9" fill="url(#t)" stroke="#1e88e5" stroke-width="2.5"/>
      <rect x="-172" y="-30" width="36" height="38" rx="10" fill="url(#t)" stroke="#8e24aa" stroke-width="2.5"/>
      <rect x="136" y="-30" width="36" height="38" rx="10" fill="url(#t)" stroke="#8e24aa" stroke-width="2.5"/>
    </g>
    <text x="0" y="-60" text-anchor="middle" font-weight="bold" fill="#880e4f">Lower jaw</text>
    <text x="0" y="-42" text-anchor="middle" fill="#880e4f" font-size="11">(lower central incisor first)</text>
  </g>
  <!-- legend -->
  <g font-size="13">
    <g filter="url(#s)">
      <rect x="470" y="70" width="320" height="250" rx="14" fill="#ffffff" stroke="#f8bbd0" stroke-width="2"/>
    </g>
    <circle cx="495" cy="100" r="8" fill="#e53935"/><text x="512" y="105"><tspan font-weight="bold">Central incisors</tspan> – 6–8 months</text>
    <circle cx="495" cy="140" r="8" fill="#fb8c00"/><text x="512" y="145"><tspan font-weight="bold">Lateral incisors</tspan> – 8–11 months</text>
    <circle cx="495" cy="180" r="8" fill="#1e88e5"/><text x="512" y="185"><tspan font-weight="bold">First molars</tspan> – 12–16 months</text>
    <circle cx="495" cy="220" r="8" fill="#43a047"/><text x="512" y="225"><tspan font-weight="bold">Canines</tspan> – 16–20 months</text>
    <circle cx="495" cy="260" r="8" fill="#8e24aa"/><text x="512" y="265"><tspan font-weight="bold">Second molars</tspan> – 20–30 months</text>
    <text x="488" y="300" font-size="11.2" fill="#455a64">Order: incisors → 1st molar → canine → 2nd molar</text>
  </g>
  <g font-size="12.5" fill="#263238">
    <text x="30" y="385"><tspan font-weight="bold" fill="#ad1457">Formula:</tspan> No. of milk teeth (up to 2 yrs) = Age in months − 6  ·  All 20 by 2½ yrs</text>
    <text x="30" y="408"><tspan font-weight="bold" fill="#ad1457">Permanent:</tspan> 32 teeth · first permanent tooth = 1st molar at 6 yrs · 3rd molars 17–25 yrs</text>
    <text x="30" y="431"><tspan font-weight="bold" fill="#c62828">Delayed dentition</tspan> (no tooth by 13 months): rickets, hypothyroidism, Down syndrome, idiopathic</text>
  </g>
</svg>
