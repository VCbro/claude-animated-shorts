<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <radialGradient id="sk" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffeadf"/><stop offset="1" stop-color="#d79470"/></radialGradient>
    <radialGradient id="kid" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffcdd2"/><stop offset=".55" stop-color="#c62828"/><stop offset="1" stop-color="#4a0000"/></radialGradient>
    <linearGradient id="urineF" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#fff176"/></linearGradient>
    <linearGradient id="urineC" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8d6e63"/><stop offset="1" stop-color="#3e2723"/></linearGradient>
    <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#90caf9"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="880" height="430" fill="#fffcfb"/>
  <text x="440" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">Nephrotic Syndrome vs Acute Glomerulonephritis (AGN)</text>
  <g filter="url(#s)">
    <rect x="20" y="45" width="410" height="370" rx="14" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
    <rect x="450" y="45" width="410" height="370" rx="14" fill="#fbe9e7" stroke="#ff8a65" stroke-width="2"/>
  </g>
  <!-- nephrotic face with puffy eyes + frothy urine -->
  <g transform="translate(95,125)" filter="url(#s)">
    <ellipse cx="0" cy="0" rx="46" ry="48" fill="url(#sk)"/>
    <ellipse cx="-16" cy="-6" rx="13" ry="9" fill="#ffd2bf" stroke="#c97d5b"/>
    <ellipse cx="16" cy="-6" rx="13" ry="9" fill="#ffd2bf" stroke="#c97d5b"/>
    <path d="M-22 -6 h12 M10 -6 h12" stroke="#3e2723" stroke-width="2.5"/>
    <path d="M-8 22 q8 4 16 0" stroke="#8d4a2f" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(95,200)" filter="url(#s)">
    <path d="M-22 0 h44 l-5 60 h-34 z" fill="url(#gl)" stroke="#1e88e5"/>
    <path d="M-20 18 h40 l-4 40 h-32 z" fill="url(#urineF)"/>
    <circle cx="-8" cy="14" r="5" fill="#fff" stroke="#bdbdbd"/><circle cx="4" cy="11" r="6" fill="#fff" stroke="#bdbdbd"/><circle cx="14" cy="15" r="4" fill="#fff" stroke="#bdbdbd"/>
  </g>
  <g font-size="10" fill="#0d47a1" text-anchor="middle"><text x="95" y="72">periorbital puffiness</text><text x="95" y="278">frothy urine</text></g>
  <g font-size="11.8">
    <text x="175" y="72" font-weight="bold" font-size="15" fill="#0d47a1">NEPHROTIC SYNDROME</text>
    <text x="175" y="96">Age 2–6 yrs · <tspan font-weight="bold">minimal change</tspan></text>
    <text x="175" y="113">disease (commonest)</text>
    <text x="175" y="137"><tspan font-weight="bold">Massive proteinuria</tspan> (3+/4+)</text>
    <text x="175" y="156"><tspan font-weight="bold">Hypoalbuminaemia</tspan> &lt; 2.5 g/dl</text>
    <text x="175" y="175"><tspan font-weight="bold">Generalised oedema</tspan>, ascites</text>
    <text x="175" y="194"><tspan font-weight="bold">Hyperlipidaemia</tspan></text>
    <text x="175" y="218">BP usually normal</text>
    <text x="175" y="237">Haematuria usually absent</text>
    <text x="175" y="256">Complement C3 normal</text>
  </g>
  <g font-size="11.6" fill="#263238">
    <text x="35" y="305" font-weight="bold" fill="#0d47a1">Treatment &amp; nursing</text>
    <text x="35" y="326">Prednisolone 2 mg/kg/day × 6 wks → 1.5 mg/kg</text>
    <text x="35" y="343">alternate day × 6 wks</text>
    <text x="35" y="363">Daily weight, abdominal girth, urine albumin</text>
    <text x="35" y="383">Salt restriction (oedema) · normal protein diet</text>
    <text x="35" y="403">Infection prevention (peritonitis) · skin care</text>
  </g>
  <!-- AGN -->
  <g transform="translate(525,125)" filter="url(#s)">
    <ellipse cx="0" cy="0" rx="46" ry="48" fill="url(#sk)"/>
    <ellipse cx="-16" cy="-6" rx="11" ry="7" fill="#ffd2bf" stroke="#c97d5b"/>
    <ellipse cx="16" cy="-6" rx="11" ry="7" fill="#ffd2bf" stroke="#c97d5b"/>
    <circle cx="-16" cy="-6" r="3.5" fill="#3e2723"/><circle cx="16" cy="-6" r="3.5" fill="#3e2723"/>
    <path d="M-8 24 q8 -4 16 0" stroke="#8d4a2f" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(525,200)" filter="url(#s)">
    <path d="M-22 0 h44 l-5 60 h-34 z" fill="url(#gl)" stroke="#e64a19"/>
    <path d="M-20 18 h40 l-4 40 h-32 z" fill="url(#urineC)"/>
  </g>
  <g font-size="10" fill="#bf360c" text-anchor="middle"><text x="525" y="72">mild facial puffiness</text><text x="525" y="278">cola / smoky urine</text></g>
  <g font-size="11.8">
    <text x="605" y="72" font-weight="bold" font-size="15" fill="#bf360c">ACUTE GN (PSGN)</text>
    <text x="605" y="96">Age 5–12 yrs · after strep</text>
    <text x="605" y="113">throat (1–3 wk)/ skin (3–6 wk)</text>
    <text x="605" y="137"><tspan font-weight="bold">Haematuria</tspan> (cola-coloured)</text>
    <text x="605" y="156"><tspan font-weight="bold">Hypertension</tspan></text>
    <text x="605" y="175"><tspan font-weight="bold">Oliguria</tspan>, mild oedema</text>
    <text x="605" y="194">Mild proteinuria</text>
    <text x="605" y="218">ASO titre ↑</text>
    <text x="605" y="237"><tspan font-weight="bold">C3 low</tspan> (normal by 6–8 wks)</text>
    <text x="605" y="256">Self-limiting, good prognosis</text>
  </g>
  <g font-size="11.6" fill="#263238">
    <text x="465" y="305" font-weight="bold" fill="#bf360c">Treatment &amp; nursing</text>
    <text x="465" y="326">Bed rest (acute phase) · daily weight, I/O, BP</text>
    <text x="465" y="346">Restrict fluid (= insensible + urine output)</text>
    <text x="465" y="366">Restrict salt; protein restrict only if azotaemia</text>
    <text x="465" y="386">Penicillin for strep · frusemide, antihypertensive</text>
    <text x="465" y="406" fill="#c62828">Watch: hypertensive encephalopathy, CHF, AKI</text>
  </g>
</svg>
