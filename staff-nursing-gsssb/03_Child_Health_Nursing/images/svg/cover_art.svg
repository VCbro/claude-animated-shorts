<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="DejaVu Sans, Arial">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe6d3"/><stop offset="1" stop-color="#dc9670"/></radialGradient>
    <radialGradient id="hair" cx="40%" cy="30%" r="70%"><stop offset="0" stop-color="#6d4c41"/><stop offset="1" stop-color="#22140e"/></radialGradient>
    <linearGradient id="shirt" x1="0" x2="1"><stop offset="0" stop-color="#1565c0"/><stop offset=".45" stop-color="#64b5f6"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
    <linearGradient id="pant" x1="0" x2="1"><stop offset="0" stop-color="#f9a825"/><stop offset=".5" stop-color="#ffe082"/><stop offset="1" stop-color="#f57f17"/></linearGradient>
    <radialGradient id="bal1" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffcdd2"/><stop offset=".55" stop-color="#e53935"/><stop offset="1" stop-color="#7f0000"/></radialGradient>
    <radialGradient id="bal2" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#dcedc8"/><stop offset=".55" stop-color="#43a047"/><stop offset="1" stop-color="#1b5e20"/></radialGradient>
    <radialGradient id="bal3" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#e1bee7"/><stop offset=".55" stop-color="#8e24aa"/><stop offset="1" stop-color="#4a148c"/></radialGradient>
    <radialGradient id="teddy" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe0b2"/><stop offset=".6" stop-color="#bc8a5f"/><stop offset="1" stop-color="#6d4c41"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#26a69a"/><stop offset=".5" stop-color="#80cbc4"/><stop offset="1" stop-color="#00695c"/></linearGradient>
    <linearGradient id="syr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#90caf9"/></linearGradient>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="5" dy="9" stdDeviation="7" flood-opacity=".33"/></filter>
  </defs>
  <circle cx="300" cy="220" r="205" fill="url(#glow)"/>
  <!-- growth bars -->
  <g filter="url(#s)">
    <rect x="40" y="300" width="28" height="70" rx="6" fill="url(#bar)"/>
    <rect x="76" y="270" width="28" height="100" rx="6" fill="url(#bar)"/>
    <rect x="112" y="235" width="28" height="135" rx="6" fill="url(#bar)"/>
    <path d="M40 285 Q90 250 150 210" stroke="#ff7043" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M150 210 l-14 2 l8 10 z" fill="#ff7043"/>
  </g>
  <!-- balloons -->
  <g filter="url(#s)">
    <path d="M395 150 Q400 200 360 250" stroke="#78909c" stroke-width="2" fill="none"/>
    <path d="M455 135 Q440 210 362 252" stroke="#78909c" stroke-width="2" fill="none"/>
    <path d="M510 175 Q470 230 364 254" stroke="#78909c" stroke-width="2" fill="none"/>
    <ellipse cx="395" cy="110" rx="34" ry="42" fill="url(#bal1)"/>
    <ellipse cx="455" cy="95" rx="32" ry="40" fill="url(#bal2)"/>
    <ellipse cx="510" cy="138" rx="30" ry="38" fill="url(#bal3)"/>
    <ellipse cx="385" cy="95" rx="8" ry="12" fill="#fff" opacity=".55"/>
    <ellipse cx="446" cy="80" rx="7" ry="11" fill="#fff" opacity=".55"/>
    <ellipse cx="502" cy="124" rx="7" ry="10" fill="#fff" opacity=".55"/>
  </g>
  <!-- child -->
  <g filter="url(#s)">
    <path d="M255 300 L245 395 L280 395 L292 320 L305 395 L340 395 L330 300 Z" fill="url(#pant)"/>
    <path d="M245 210 Q292 190 340 210 L345 310 L240 310 Z" fill="url(#shirt)"/>
    <path d="M335 220 Q360 235 362 252" stroke="url(#skin)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M250 220 Q225 260 230 290" stroke="url(#skin)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="292" cy="160" r="48" fill="url(#skin)"/>
    <path d="M246 150 Q250 100 300 108 Q340 112 340 150 Q320 128 292 132 Q262 130 246 150 Z" fill="url(#hair)"/>
    <circle cx="275" cy="162" r="5" fill="#3e2723"/><circle cx="310" cy="162" r="5" fill="#3e2723"/>
    <circle cx="277" cy="160" r="1.6" fill="#fff"/><circle cx="312" cy="160" r="1.6" fill="#fff"/>
    <path d="M276 183 Q293 197 310 183" stroke="#bf360c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="263" cy="178" r="7" fill="#ff8a80" opacity=".55"/><circle cx="322" cy="178" r="7" fill="#ff8a80" opacity=".55"/>
  </g>
  <!-- teddy -->
  <g transform="translate(170,330)" filter="url(#s)">
    <circle cx="-22" cy="-48" r="11" fill="url(#teddy)"/><circle cx="22" cy="-48" r="11" fill="url(#teddy)"/>
    <ellipse cx="0" cy="18" rx="30" ry="34" fill="url(#teddy)"/>
    <circle cx="0" cy="-30" r="26" fill="url(#teddy)"/>
    <ellipse cx="0" cy="-22" rx="10" ry="7" fill="#ffe0b2"/>
    <circle cx="-9" cy="-35" r="3" fill="#3e2723"/><circle cx="9" cy="-35" r="3" fill="#3e2723"/><circle cx="0" cy="-24" r="3" fill="#3e2723"/>
  </g>
  <!-- syringe -->
  <g transform="translate(470,300) rotate(-35)" filter="url(#s)">
    <rect x="-55" y="-13" width="95" height="26" rx="6" fill="url(#syr)" stroke="#1565c0" stroke-width="2"/>
    <rect x="-40" y="-9" width="55" height="18" rx="3" fill="#4fc3f7" opacity=".75"/>
    <rect x="-75" y="-4" width="22" height="8" fill="#90a4ae"/><rect x="-82" y="-15" width="8" height="30" rx="3" fill="#607d8b"/>
    <rect x="40" y="-4" width="12" height="8" fill="#90a4ae"/><path d="M52 -1.5 L88 0 L52 1.5 Z" fill="#78909c"/>
  </g>
  <!-- heart -->
  <g transform="translate(92,120) scale(.75)" filter="url(#s)">
    <path d="M0 30 C-55 -10 -30 -60 0 -30 C30 -60 55 -10 0 30 Z" fill="url(#bal1)"/>
    <path d="M-30 -5 h14 l6 -12 l8 24 l6 -12 h16" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
