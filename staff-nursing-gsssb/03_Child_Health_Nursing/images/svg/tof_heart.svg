<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <radialGradient id="hrt" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ffcdd2"/><stop offset=".55" stop-color="#e57373"/><stop offset="1" stop-color="#8e1b1b"/></radialGradient>
    <linearGradient id="ao" x1="0" x2="1"><stop offset="0" stop-color="#b71c1c"/><stop offset=".45" stop-color="#ef5350"/><stop offset="1" stop-color="#7f0000"/></linearGradient>
    <linearGradient id="pa" x1="0" x2="1"><stop offset="0" stop-color="#0d47a1"/><stop offset=".45" stop-color="#64b5f6"/><stop offset="1" stop-color="#0d3c7a"/></linearGradient>
    <radialGradient id="ch" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f8bbd0"/></radialGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-opacity=".33"/></filter>
  </defs>
  <rect width="860" height="460" fill="#fffafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#b71c1c">Tetralogy of Fallot (TOF) – Most Common Cyanotic CHD</text>
  <g transform="translate(230,250)" filter="url(#s)">
    <!-- aorta (overriding) -->
    <path d="M-5 -95 Q-10 -175 60 -180 Q120 -180 120 -130 L95 -130 Q95 -155 60 -155 Q20 -153 22 -95 Z" fill="url(#ao)"/>
    <!-- pulmonary artery narrowed -->
    <path d="M-60 -95 L-58 -125 Q-70 -150 -110 -150 L-110 -132 Q-82 -132 -80 -120 L-78 -95 Z" fill="url(#pa)"/>
    <!-- heart -->
    <path d="M-120 -90 Q-160 -40 -130 50 Q-80 150 10 170 Q100 120 130 30 Q150 -60 90 -95 Q30 -110 0 -95 Q-60 -110 -120 -90 Z" fill="url(#hrt)"/>
    <!-- chambers -->
    <ellipse cx="-62" cy="-45" rx="40" ry="30" fill="url(#ch)" opacity=".8"/>
    <ellipse cx="62" cy="-45" rx="40" ry="30" fill="url(#ch)" opacity=".8"/>
    <path d="M-110 0 Q-115 80 -20 125 L-8 10 Z" fill="#ffe0e8" stroke="#c62828" stroke-width="5"/>
    <path d="M110 -5 Q115 80 10 130 L6 10 Z" fill="#fff0f3"/>
    <!-- VSD gap in septum -->
    <path d="M0 10 L-8 125" stroke="#8e1b1b" stroke-width="10"/>
    <rect x="-14" y="20" width="20" height="34" fill="#ffe0e8"/>
    <path d="M-30 37 h44" stroke="#7b1fa2" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="-62" y="-40" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">RA</text>
    <text x="62" y="-40" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">LA</text>
    <text x="-60" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">RV</text>
    <text x="55" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#880e4f">LV</text>
    <!-- narrowing mark -->
    <ellipse cx="-68" cy="-110" rx="16" ry="6" fill="none" stroke="#ffeb3b" stroke-width="3"/>
  </g>
  <!-- callouts -->
  <g stroke="#455a64" stroke-width="1.5" fill="none">
    <path d="M180 140 L130 100 L95 100"/>
    <path d="M260 90 L320 70 L420 70"/>
    <path d="M222 287 L320 300 L420 300"/>
    <path d="M140 325 L100 380 L60 380"/>
  </g>
  <g font-size="12.5" font-weight="bold">
    <circle cx="80" cy="100" r="12" fill="#1565c0"/><text x="80" y="105" text-anchor="middle" fill="#fff">1</text>
    <circle cx="435" cy="70" r="12" fill="#c62828"/><text x="435" y="75" text-anchor="middle" fill="#fff">2</text>
    <circle cx="435" cy="300" r="12" fill="#7b1fa2"/><text x="435" y="305" text-anchor="middle" fill="#fff">3</text>
    <circle cx="45" cy="380" r="12" fill="#2e7d32"/><text x="45" y="385" text-anchor="middle" fill="#fff">4</text>
  </g>
  <g font-size="11" fill="#37474f">
    <text x="22" y="128">Pulmonary stenosis</text>
    <text x="455" y="75" font-weight="bold" fill="#c62828">Overriding aorta</text>
    <text x="455" y="305" font-weight="bold" fill="#7b1fa2">VSD</text>
    <text x="20" y="408">RV hypertrophy</text>
  </g>
  <g filter="url(#s)"><rect x="520" y="100" width="320" height="300" rx="14" fill="#ffffff" stroke="#ef9a9a" stroke-width="2"/></g>
  <g font-size="12">
    <text x="535" y="126" font-weight="bold" font-size="14" fill="#b71c1c">4 defects – "PROV"</text>
    <text x="535" y="150"><tspan font-weight="bold">P</tspan>ulmonary stenosis (RVOT obstruction)</text>
    <text x="535" y="170"><tspan font-weight="bold">R</tspan>ight ventricular hypertrophy</text>
    <text x="535" y="190"><tspan font-weight="bold">O</tspan>verriding of aorta</text>
    <text x="535" y="210"><tspan font-weight="bold">V</tspan>entricular septal defect</text>
    <text x="535" y="240" font-weight="bold" fill="#b71c1c">Features</text>
    <text x="535" y="262">Cyanosis, clubbing, polycythaemia</text>
    <text x="535" y="282">X-ray: boot-shaped heart</text>
    <text x="535" y="302"><tspan font-weight="bold">Squatting</tspan> (↑ SVR → less R→L shunt)</text>
    <text x="535" y="330" font-weight="bold" fill="#b71c1c">Tet (hypercyanotic) spell</text>
    <text x="535" y="352">Knee-chest position · O₂ · calm child</text>
    <text x="535" y="372">Morphine · propranolol · IV fluids</text>
    <text x="535" y="392">Definitive: total surgical correction</text>
  </g>
  <text x="430" y="444" text-anchor="middle" font-size="12" fill="#455a64">Deoxygenated blood RV → overriding aorta through VSD (right-to-left shunt) → central cyanosis</text>
</svg>
