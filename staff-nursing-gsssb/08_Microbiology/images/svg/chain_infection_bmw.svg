<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#fff3e0"/></linearGradient>
    <radialGradient id="c1" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffebee"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#7f0000"/></radialGradient>
    <linearGradient id="yel" x1="0" x2="1"><stop offset="0" stop-color="#f9a825"/><stop offset=".5" stop-color="#fff176"/><stop offset="1" stop-color="#f57f17"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#b71c1c"/><stop offset=".5" stop-color="#ef5350"/><stop offset="1" stop-color="#7f0000"/></linearGradient>
    <linearGradient id="wht" x1="0" x2="1"><stop offset="0" stop-color="#b0bec5"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#90a4ae"/></linearGradient>
    <linearGradient id="blu" x1="0" x2="1"><stop offset="0" stop-color="#0d47a1"/><stop offset=".5" stop-color="#64b5f6"/><stop offset="1" stop-color="#0d47a1"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity=".3"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6d4c41"/></marker>
  </defs>
  <rect width="900" height="560" rx="22" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#bf360c">Chain of Infection &amp; BMW Colour Coding (Rules 2016)</text>
  <g filter="url(#s)" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="225" cy="105" r="46" fill="url(#c1)"/><text x="225" y="102">Infectious</text><text x="225" y="117">agent</text>
    <circle cx="345" cy="175" r="46" fill="#ef6c00"/><text x="345" y="180">Reservoir</text>
    <circle cx="325" cy="300" r="46" fill="#f9a825"/><text x="325" y="297">Portal of</text><text x="325" y="312">exit</text>
    <circle cx="225" cy="360" r="46" fill="#43a047"/><text x="225" y="357">Mode of</text><text x="225" y="372">transmission</text>
    <circle cx="125" cy="300" r="46" fill="#1e88e5"/><text x="125" y="297">Portal of</text><text x="125" y="312">entry</text>
    <circle cx="105" cy="175" r="46" fill="#8e24aa"/><text x="105" y="172">Susceptible</text><text x="105" y="187">host</text>
  </g>
  <text x="225" y="232" text-anchor="middle" font-size="13" fill="#4e342e" font-weight="bold">Break any link</text>
  <text x="225" y="250" text-anchor="middle" font-size="13" fill="#4e342e">Hand hygiene = most</text>
  <text x="225" y="266" text-anchor="middle" font-size="13" fill="#4e342e">effective single step</text>
  <g font-size="13" fill="#263238">
    <text x="30" y="440">• Contact (MRSA) · Droplet (&gt; 5 µm – influenza)</text>
    <text x="30" y="462">• Airborne (&lt; 5 µm – TB, measles – N95, AIIR)</text>
    <text x="30" y="484">• Vehicle (food, water, blood) · Vector (mosquito, flies)</text>
    <text x="30" y="510">• Standard precautions for ALL patients</text>
  </g>
  <g filter="url(#s)">
    <rect x="470" y="70" width="88" height="120" rx="10" fill="url(#yel)"/>
    <rect x="572" y="70" width="88" height="120" rx="10" fill="url(#red)"/>
    <rect x="674" y="70" width="88" height="120" rx="10" fill="url(#wht)"/>
    <rect x="776" y="70" width="88" height="120" rx="10" fill="url(#blu)"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="514" y="135" fill="#5d4037" font-size="14">YELLOW</text><text x="616" y="135" fill="#fff">RED</text>
    <text x="718" y="128" fill="#37474f">WHITE</text><text x="718" y="146" fill="#37474f" font-size="10">(translucent)</text>
    <text x="820" y="135" fill="#fff">BLUE</text>
  </g>
  <g font-size="12" fill="#263238">
    <text x="470" y="218" font-weight="bold" fill="#f57f17">Yellow</text>
    <text x="470" y="236">Anatomical/ human tissue, placenta, soiled</text>
    <text x="470" y="252">dressings &amp; cotton, expired medicines,</text>
    <text x="470" y="268">cytotoxic, chemical, lab cultures → incineration</text>
    <text x="470" y="296" font-weight="bold" fill="#c62828">Red</text>
    <text x="470" y="314">Contaminated recyclable plastic – tubing,</text>
    <text x="470" y="330">catheters, IV sets, urine bags, syringes</text>
    <text x="470" y="346">without needles, gloves → autoclave + shred</text>
    <text x="470" y="374" font-weight="bold" fill="#455a64">White (puncture-proof)</text>
    <text x="470" y="392">Sharps – needles, blades, scalpels</text>
    <text x="470" y="420" font-weight="bold" fill="#1565c0">Blue (cardboard box)</text>
    <text x="470" y="438">Glassware – broken/ discarded glass, vials,</text>
    <text x="470" y="454">ampoules; metallic implants</text>
    <text x="470" y="484" font-weight="bold" fill="#bf360c">Untreated waste storage ≤ 48 hrs</text>
    <text x="470" y="504">Biohazard symbol on bags · Black – general</text>
    <text x="470" y="520">(non-infectious, municipal) waste</text>
  </g>
</svg>
