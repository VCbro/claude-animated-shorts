<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="DejaVu Sans, Arial" font-size="11.5">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-opacity=".25"/></filter>
    <linearGradient id="z1" x1="0" x2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset="1" stop-color="#e8f5e9"/></linearGradient>
  </defs>
  <rect width="720" height="460" fill="#fbfdff"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a237e">Partograph (WHO modified) – Cervicograph</text>
  <g transform="translate(90,50)">
    <rect width="480" height="300" fill="#fff" stroke="#90a4ae" filter="url(#s)"/>
    <g stroke="#e0e6ea"><line x1="0" y1="30" x2="480" y2="30"/><line x1="0" y1="60" x2="480" y2="60"/><line x1="0" y1="90" x2="480" y2="90"/><line x1="0" y1="120" x2="480" y2="120"/><line x1="0" y1="150" x2="480" y2="150"/><line x1="0" y1="180" x2="480" y2="180"/><line x1="0" y1="210" x2="480" y2="210"/><line x1="0" y1="240" x2="480" y2="240"/><line x1="0" y1="270" x2="480" y2="270"/>
      <line x1="40" y1="0" x2="40" y2="300"/><line x1="80" y1="0" x2="80" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="160" y1="0" x2="160" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="280" y1="0" x2="280" y2="300"/><line x1="320" y1="0" x2="320" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="440" y1="0" x2="440" y2="300"/></g>
    <path d="M0 180 L240 0 L0 0 Z" fill="url(#z1)" opacity=".6"/>
    <line x1="0" y1="180" x2="240" y2="0" stroke="#2e7d32" stroke-width="3"/>
    <line x1="160" y1="180" x2="400" y2="0" stroke="#c62828" stroke-width="3"/>
    <polyline points="0,180 40,150 80,120 120,90 160,60" fill="none" stroke="#1565c0" stroke-width="2.5"/>
    <g fill="#1565c0"><text x="-6" y="185">X</text><text x="34" y="155">X</text><text x="74" y="125">X</text><text x="114" y="95">X</text><text x="154" y="65">X</text></g>
    <g fill="#e65100" font-weight="bold"><text x="-5" y="155">O</text><text x="35" y="185">O</text><text x="75" y="215">O</text><text x="115" y="245">O</text><text x="155" y="275">O</text></g><polyline points="0,150 40,180 80,210 120,240 160,270" fill="none" stroke="#e65100" stroke-width="1.5" stroke-dasharray="3 3"/>
    <g font-size="11" text-anchor="end" fill="#37474f"><text x="-12" y="4">10</text><text x="-12" y="34">9</text><text x="-12" y="64">8</text><text x="-12" y="94">7</text><text x="-12" y="124">6</text><text x="-12" y="154">5</text><text x="-12" y="184">4</text><text x="-12" y="214">3</text><text x="-12" y="244">2</text><text x="-12" y="274">1</text></g>
    <g font-size="11" text-anchor="middle" fill="#37474f"><text x="0" y="318">0</text><text x="80" y="318">2</text><text x="160" y="318">4</text><text x="240" y="318">6</text><text x="320" y="318">8</text><text x="400" y="318">10</text><text x="480" y="318">12 hrs</text></g>
    <text x="250" y="20" fill="#2e7d32" font-weight="bold" font-size="12">ALERT line (1 cm/hr)</text>
    <text x="330" y="110" fill="#c62828" font-weight="bold" font-size="12">ACTION line</text><text x="330" y="126" fill="#c62828" font-size="11">(4 hrs right of alert)</text>
  </g>
  <text x="35" y="200" font-size="11" fill="#37474f" transform="rotate(-90 35 200)">Cervical dilatation (cm)</text>
  <g transform="translate(590,70)" font-size="11">
    <text x="0" y="0" font-weight="bold" fill="#1565c0">X = Cervical</text><text x="0" y="14" fill="#1565c0">dilatation</text>
    <text x="0" y="40" font-weight="bold" fill="#e65100">O = Descent of</text><text x="0" y="54" fill="#e65100">head (fifths</text><text x="0" y="68" fill="#e65100">palpable 5→0)</text>
    <text x="0" y="98" font-weight="bold" fill="#2e7d32">Left of alert</text><text x="0" y="112">= normal</text>
    <text x="0" y="138" font-weight="bold" fill="#ef6c00">Between lines</text><text x="0" y="152">= refer/ watch</text>
    <text x="0" y="178" font-weight="bold" fill="#c62828">Crosses action</text><text x="0" y="192">= intervene</text>
  </g>
  <text x="20" y="390" font-size="11.5" fill="#1a237e"><tspan font-weight="bold">Partograph (Philpott, 1972)</tspan> – FHR & contractions & pulse ½ hrly · cervix & descent 4 hrly (PV)</text><text x="20" y="408" font-size="11.5" fill="#1a237e">BP & temperature 4 hrly · liquor, moulding, oxytocin, drugs, urine bhi record</text>
  <text x="20" y="430" font-size="11.5" fill="#1a237e">Plotting active phase se (4 cm; WHO Labour Care Guide 2020 – 5 cm)</text><text x="20" y="448" font-size="11.5" fill="#1a237e">Liquor: I – intact, C – clear, M – meconium, B – blood-stained · Descent "O" 5/5 → 0/5</text>
</svg>
