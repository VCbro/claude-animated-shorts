<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="endo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8bbd0"/><stop offset="1" stop-color="#ad1457"/></linearGradient>
    <radialGradient id="fol" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#f9a825"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
  </defs>
  <rect width="740" height="490" fill="#fffafc"/>
  <text x="370" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#ad1457">Menstrual Cycle (28 days) – Hormones, Ovary &amp; Endometrium</text>
  <g transform="translate(110,45)">
    <!-- hormone curves -->
    <rect width="560" height="150" fill="#fff" stroke="#e0e0e0"/>
    <path d="M0 110 Q60 90 150 100 Q250 105 270 20 Q285 105 330 120 Q450 125 560 115" stroke="#7b1fa2" stroke-width="3" fill="none"/>
    <path d="M0 125 Q100 120 180 110 Q240 105 270 60 Q290 120 330 125 Q450 128 560 125" stroke="#1e88e5" stroke-width="3" fill="none"/>
    <path d="M0 130 Q150 120 240 50 Q270 60 300 110 Q380 70 440 75 Q520 100 560 130" stroke="#e91e63" stroke-width="3" fill="none"/>
    <path d="M0 140 Q260 140 300 135 Q380 50 440 45 Q520 80 560 140" stroke="#ff9800" stroke-width="3" fill="none"/>
    <line x1="280" y1="0" x2="280" y2="380" stroke="#c62828" stroke-dasharray="5 4" stroke-width="2"/>
    <g font-size="11" font-weight="bold"><text x="290" y="18" fill="#7b1fa2">LH surge</text><text x="190" y="58" fill="#e91e63">Oestrogen peak</text><text x="400" y="38" fill="#ff9800">Progesterone</text><text x="20" y="102" fill="#1e88e5">FSH</text></g>
    <!-- ovary row -->
    <g transform="translate(0,175)" filter="url(#s)">
      <circle cx="40" cy="30" r="10" fill="url(#fol)"/><circle cx="120" cy="30" r="15" fill="url(#fol)"/><circle cx="210" cy="30" r="22" fill="url(#fol)"/>
      <circle cx="280" cy="30" r="24" fill="url(#fol)"/><path d="M290 20 l18 -14" stroke="#f9a825" stroke-width="4"/><circle cx="312" cy="3" r="5" fill="#fff59d" stroke="#f57f17"/>
      <circle cx="380" cy="30" r="22" fill="#ffca28"/><circle cx="460" cy="30" r="20" fill="#ffb300"/><circle cx="540" cy="30" r="12" fill="#e0e0e0"/>
    </g>
    <g font-size="11" text-anchor="middle" transform="translate(0,175)"><text x="120" y="72" fill="#f57f17">Follicles grow (Graafian)</text><text x="300" y="72" fill="#c62828" font-weight="bold">Ovulation</text><text x="440" y="72" fill="#e65100">Corpus luteum</text><text x="540" y="72" fill="#757575">albicans</text></g>
    <!-- endometrium -->
    <g transform="translate(0,265)" filter="url(#s)">
      <path d="M0 40 L70 40 L70 30 Q170 25 280 10 Q400 0 520 0 L560 40 Z" fill="url(#endo)"/>
      <rect x="0" y="30" width="70" height="10" fill="#c62828"/>
    </g>
    <g font-size="11" font-weight="bold" transform="translate(0,330)">
      <text x="0" y="0" fill="#c62828">Menstrual</text><text x="0" y="14" fill="#c62828">(day 1–5)</text>
      <text x="130" y="0" fill="#ad1457">Proliferative/ Follicular</text><text x="130" y="14" fill="#ad1457">(day 6–14) – oestrogen</text>
      <text x="350" y="0" fill="#6a1b9a">Secretory/ Luteal</text><text x="350" y="14" fill="#6a1b9a">(day 15–28) – progesterone</text>
    </g>
    <g font-size="11" fill="#455a64"><text x="0" y="372">1</text><text x="140" y="372">7</text><text x="275" y="372">14</text><text x="415" y="372">21</text><text x="545" y="372">28</text></g>
  </g>
  <g font-size="11" font-weight="bold" fill="#455a64" text-anchor="end"><text x="100" y="120">Hormones</text><text x="100" y="250">Ovary</text><text x="100" y="335">Endometrium</text></g>
  <text x="20" y="450" font-size="11.5" fill="#ad1457">Ovulation = next period se <tspan font-weight="bold">14 din pehle</tspan> (luteal phase fixed 14 days)</text><text x="20" y="470" font-size="11.5" fill="#ad1457">Ovum life 12–24 hrs · sperm 48–72 hrs · fertile period ~day 10–17 (28-day cycle)</text>
</svg>
