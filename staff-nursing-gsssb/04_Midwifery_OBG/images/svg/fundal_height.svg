<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#d99a74"/><stop offset=".5" stop-color="#ffe2cf"/><stop offset="1" stop-color="#c98560"/></linearGradient>
    <radialGradient id="ut" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe4ec"/><stop offset="1" stop-color="#f06292"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity=".3"/></filter>
  </defs>
  <rect width="720" height="460" fill="#fff9fb"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#ad1457">Fundal Height – Weeks of Pregnancy (Abdominal palpation)</text>
  <g filter="url(#s)">
    <path d="M200 50 Q180 50 175 90 L165 230 Q150 330 190 420 L430 420 Q470 330 455 230 L445 90 Q440 50 420 50 Z" fill="url(#body)" stroke="#a5683f" stroke-width="2"/>
    <path d="M230 405 Q215 330 230 250 Q245 150 310 105 Q375 150 390 250 Q405 330 390 405 Z" fill="url(#ut)" opacity=".75" stroke="#ad1457" stroke-width="2"/>
  </g>
  <circle cx="310" cy="260" r="6" fill="#8d5a3b"/>
  <path d="M290 95 L310 80 L330 95" stroke="#8d5a3b" stroke-width="3" fill="none"/>
  <path d="M270 410 Q310 420 350 410" stroke="#8d5a3b" stroke-width="4" fill="none"/>
  <g stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4">
    <line x1="170" y1="398" x2="460" y2="398"/><line x1="170" y1="345" x2="460" y2="345"/><line x1="170" y1="300" x2="460" y2="300"/>
    <line x1="170" y1="260" x2="460" y2="260"/><line x1="170" y1="225" x2="460" y2="225"/><line x1="170" y1="185" x2="460" y2="185"/>
    <line x1="170" y1="115" x2="460" y2="115"/><line x1="170" y1="155" x2="460" y2="155" stroke="#c62828"/>
  </g>
  <g font-weight="bold" font-size="12.5" fill="#0d47a1" text-anchor="end">
    <text x="160" y="402">12 wks</text><text x="160" y="349">16 wks</text><text x="160" y="304">20 wks</text><text x="160" y="264">24 wks</text>
    <text x="160" y="229">28 wks</text><text x="160" y="189">32 wks</text><text x="160" y="119">36 wks</text><text x="160" y="159" fill="#c62828">40 wks</text>
  </g>
  <g font-size="11.5">
    <text x="470" y="402">Just above symphysis pubis</text>
    <text x="470" y="349">Midway symphysis – umbilicus</text>
    <text x="470" y="304">~2 finger below umbilicus</text>
    <text x="470" y="264" font-weight="bold" fill="#8d5a3b">At umbilicus (22–24 wks)</text>
    <text x="470" y="229">⅓ umbilicus → xiphisternum</text>
    <text x="470" y="193">⅔ umbilicus → xiphisternum</text>
    <text x="470" y="119" font-weight="bold" fill="#1565c0">Xiphisternum (highest)</text>
    <text x="470" y="152" fill="#c62828" font-weight="bold">Thoda neeche (~34 wk level)</text><text x="470" y="166" fill="#c62828">"Lightening" – head engages</text>
  </g>
  <text x="20" y="445" font-size="12" fill="#ad1457"><tspan font-weight="bold">Symphysio-fundal height (SFH, cm)</tspan> ≈ weeks of gestation (20–36 wks) ± 2 cm · bladder empty</text>
</svg>
