<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="DejaVu Sans, Arial" font-size="12">
  <defs>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#d99a74"/><stop offset=".5" stop-color="#ffe2cf"/><stop offset="1" stop-color="#c98560"/></linearGradient>
    <radialGradient id="ut" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd6e2"/><stop offset="1" stop-color="#d81b60"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="5" flood-opacity=".3"/></filter>
  </defs>
  <rect width="740" height="440" fill="#fffafc"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#ad1457">Involution of Uterus &amp; Lochia (Puerperium – 6 weeks)</text>
  <g filter="url(#s)"><path d="M90 60 Q80 60 78 90 L70 300 Q75 360 110 380 L290 380 Q325 360 330 300 L322 90 Q320 60 310 60 Z" fill="url(#body)" stroke="#a5683f" stroke-width="2"/></g>
  <circle cx="200" cy="160" r="6" fill="#8d5a3b"/>
  <path d="M150 372 Q200 382 250 372" stroke="#8d5a3b" stroke-width="4" fill="none"/>
  <g filter="url(#s)" opacity=".85">
    <ellipse cx="200" cy="250" rx="55" ry="95" fill="url(#ut)" opacity=".35"/>
    <ellipse cx="200" cy="295" rx="38" ry="65" fill="url(#ut)" opacity=".55"/>
    <ellipse cx="200" cy="340" rx="22" ry="30" fill="url(#ut)"/>
  </g>
  <g stroke="#1565c0" stroke-dasharray="5 4" stroke-width="2"><line x1="70" y1="158" x2="350" y2="158"/><line x1="70" y1="230" x2="350" y2="230"/><line x1="70" y1="310" x2="350" y2="310"/><line x1="70" y1="370" x2="350" y2="370"/></g>
  <g font-size="11.5" font-weight="bold" fill="#0d47a1">
    <text x="355" y="162">Day 1 – at/ just below umbilicus</text>
    <text x="355" y="234">Day 6–7 – midway umbilicus–symphysis</text>
    <text x="355" y="314">Day 10–14 – not palpable abdominally</text>
    <text x="355" y="374">6 weeks – normal size (50–60 g)</text>
  </g>
  <text x="355" y="180" font-size="11.5" fill="#37474f">(~12–13 cm above symphysis)</text><text x="355" y="200" font-size="11.5" fill="#37474f">Fundus ~1 cm (1 finger) per day neeche aata hai</text>
  <g transform="translate(30,396)" font-size="11.5">
    <text x="0" y="0"><tspan font-weight="bold" fill="#c62828">Lochia rubra</tspan> (red) day 1–3/4 · <tspan font-weight="bold" fill="#ec407a">Lochia serosa</tspan> (pink-brown) day 4–10</text><text x="0" y="18"><tspan font-weight="bold" fill="#9e9d24">Lochia alba</tspan> (yellow-white) day 10 – 6 weeks</text>
    <text x="0" y="36" fill="#c62828">Foul smell → infection · Rubra persist / bright red clots → subinvolution / retained bits</text>
  </g>
</svg>
