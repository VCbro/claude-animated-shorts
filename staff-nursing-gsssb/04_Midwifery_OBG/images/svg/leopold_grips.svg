<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="DejaVu Sans, Arial" font-size="11.5">
  <defs>
    <linearGradient id="ab" x1="0" x2="1"><stop offset="0" stop-color="#d99a74"/><stop offset=".5" stop-color="#ffe2cf"/><stop offset="1" stop-color="#c98560"/></linearGradient>
    <radialGradient id="head" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff0e6"/><stop offset="1" stop-color="#e09a74"/></radialGradient>
    <radialGradient id="hand" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#5c8fd6"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity=".3"/></filter>
    <g id="belly"><ellipse cx="0" cy="0" rx="70" ry="95" fill="url(#ab)" stroke="#a5683f" stroke-width="2"/><circle cx="0" cy="62" r="24" fill="url(#head)" stroke="#a5683f"/><path d="M-30 50 Q-40 -20 -5 -60 Q25 -70 30 -40" stroke="#c98560" stroke-width="16" fill="none" stroke-linecap="round" opacity=".7"/></g>
  </defs>
  <rect width="760" height="360" fill="#fffaf6"/>
  <text x="380" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#4e342e">Leopold's Manoeuvres – 4 Abdominal Grips</text>
  <g transform="translate(100,150)" filter="url(#s)"><use href="#belly"/><ellipse cx="-30" cy="-85" rx="26" ry="13" fill="url(#hand)" transform="rotate(-20 -30 -85)"/><ellipse cx="30" cy="-85" rx="26" ry="13" fill="url(#hand)" transform="rotate(20 30 -85)"/></g>
  <g transform="translate(290,150)" filter="url(#s)"><use href="#belly"/><ellipse cx="-68" cy="0" rx="13" ry="28" fill="url(#hand)"/><ellipse cx="68" cy="0" rx="13" ry="28" fill="url(#hand)"/></g>
  <g transform="translate(480,150)" filter="url(#s)"><use href="#belly"/><path d="M-30 75 Q0 55 30 75 L28 92 Q0 80 -28 92 Z" fill="url(#hand)"/></g>
  <g transform="translate(670,150)" filter="url(#s)"><use href="#belly"/><ellipse cx="-40" cy="75" rx="12" ry="26" fill="url(#hand)" transform="rotate(25 -40 75)"/><ellipse cx="40" cy="75" rx="12" ry="26" fill="url(#hand)" transform="rotate(-25 40 75)"/></g>
  <g font-weight="bold" text-anchor="middle" font-size="13" fill="#ad1457">
    <text x="100" y="268">1. Fundal grip</text><text x="290" y="268">2. Lateral grip</text><text x="480" y="268">3. Pawlik's grip</text><text x="670" y="268">4. Pelvic grip</text>
  </g>
  <g text-anchor="middle" fill="#37474f">
    <text x="100" y="286">Fundus me kya hai?</text><text x="100" y="301">Lie & presentation</text><text x="100" y="316">(soft breech / hard head)</text>
    <text x="290" y="286">Dono side palpate</text><text x="290" y="301">Back (smooth) vs limbs</text><text x="290" y="316">→ POSITION</text>
    <text x="480" y="286">Ek haath se lower pole</text><text x="480" y="301">Presenting part &amp;</text><text x="480" y="316">engagement (mobile?)</text>
    <text x="670" y="286">Face patient's FEET</text><text x="670" y="301">Dono haath – attitude,</text><text x="670" y="316">descent (fifths palpable)</text>
  </g>
  <text x="380" y="346" text-anchor="middle" fill="#4e342e">Pehle 3 grips – patient ke face ki taraf; 4th grip – feet ki taraf · Bladder empty, supine knees flexed, warm hands</text>
</svg>
