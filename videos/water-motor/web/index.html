  <style>
    @font-face { font-family: "Mont"; font-weight: 600; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2) format("woff2"); }
    @font-face { font-family: "Mont"; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format("woff2"); }
    @font-face { font-family: "Mont"; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format("woff2"); }
    :root { --y: #ffd23f; --c: #49d6ff; --ink: #0b1622; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Mont", sans-serif; color: #fff;
      background: radial-gradient(120% 75% at 50% 38%, #24415c 0%, #142739 48%, #0a1520 100%); }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .labels { position: fixed; inset: 0; }
    .label { padding: 10px 18px 12px; border-radius: 18px; background: rgba(8, 18, 30, .78); box-shadow: 0 0 0 2px rgba(255,255,255,.14); }
    .label b { display: block; font-weight: 900; font-size: 46px; letter-spacing: .02em; text-transform: uppercase; color: var(--y); }
    .label span { display: block; font-weight: 600; font-size: 31px; color: #d8e6f2; }
    .leader { fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 3.5; }
    #title { position: fixed; left: 0; right: 0; top: 150px; text-align: center; font-weight: 900; text-transform: uppercase;

    #title em { font-style: normal; color: var(--c); }
    #cap { position: fixed; left: 60px; right: 60px; top: 1235px; text-align: center; font-weight: 900; text-transform: uppercase;
      font-size: 74px; line-height: 1.08; letter-spacing: -.005em; -webkit-text-stroke: 3px #000; paint-order: stroke fill;

    #cap span { display: inline-block; margin: 0 .14em; transform-origin: 50% 70%; }
    #cap span.on { color: var(--y); }
    .chip { position: fixed; left: 50%; transform: translateX(-50%); padding: 16px 34px 18px; border-radius: 26px; white-space: nowrap;
      font-weight: 900; font-size: 54px; text-transform: uppercase; background: rgba(8, 18, 30, .82); box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
    #rpm { top: 300px; } #rpm small { font-size: 32px; color: #9fb6c9; margin-left: 12px; }
    #state { top: 300px; }
    #chain { position: fixed; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #chain div { font-weight: 900; font-size: 64px; text-transform: uppercase; padding: 8px 34px 12px; border-radius: 22px; background: rgba(8,18,30,.8);
      box-shadow: 0 0 0 3px rgba(255,255,255,.16); }
    #chain i { font-style: normal; font-size: 44px; color: #9fb6c9; line-height: .6; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="chain"></div>
  <div id="cap"></div>
  <script type="module" src="./main.js"></script>
