<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Documentary</title>
<style>
  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-600-normal.woff2); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }

  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2013-2022, U+2190-21FF, U+2248, U+00D7; }
  @font-face { font-family: B; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); unicode-range: U+0000-00FF, U+2013-2022, U+2190-21FF, U+2248, U+00D7; }
  @font-face { font-family: M; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2); }
 @font-face { font-family: T; src: url(/node_modules/@fontsource/tiro-devanagari-hindi/files/tiro-devanagari-hindi-devanagari-400-normal.woff2); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: T; src: url(/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2); unicode-range: U+0000-00FF, U+2013-2022, U+2190-21FF, U+00D7; }
  :root { --acc: #ffd166; --acc2: #7fd8ff; --panel: rgba(8,12,22,.82); --txt: #fff; --sub: #d6e2f0; --capbg: rgba(5,8,15,.55); --captxt: #fff; --capon: #ffd166; --capbottom: 54px; --tfont: B; --glow: 0 6px 30px rgba(0,0,0,.6); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05080f; font-family: B, sans-serif; color: #fff; }
  canvas { position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .t { position: absolute; white-space: nowrap; }
  .lab { padding: 8px 24px 5px; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 2px rgba(255,255,255,.16), 0 10px 30px rgba(0,0,0,.35);
         font-weight: 800; font-size: 40px; color: var(--acc); line-height: 1.2; }
  .lab i { display: block; font-style: normal; font-weight: 600; font-size: 26px; color: var(--sub); }
  .big { font-family: M, B; font-weight: 900; letter-spacing: -2px; }
  .ttl { font-weight: 800; text-shadow: var(--glow); text-align: center; font-family: var(--tfont), B, sans-serif; }
  .chap { font-weight: 800; font-size: 30px; letter-spacing: 1px; color: var(--acc2); text-transform: uppercase; }
  #cap { position: absolute; left: 50px; right: 50px; top: 1300px; white-space: normal; color: var(--captxt); text-align: center; font-weight: 800; font-size: 74px; line-height: 1.2; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
         text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 20px rgba(0,0,0,.7); }
  #cap .box { display: inline-block; padding: 4px 26px 0; border-radius: 14px; background: var(--capbg); }
 #cap span.on { color: var(--capon); }
  .theme-cinematic #cap { font-family: T, B, sans-serif; font-weight: 400; font-size: 50px; letter-spacing: 0; }
  .theme-cinematic, .theme-archive { font-variant-numeric: lining-nums; }
  .theme-archive #cap, .theme-archive .lab { font-family: T, B, sans-serif; font-weight: 400; }
  .theme-archive .lab { border-radius: 4px; box-shadow: 0 0 0 2px rgba(243,211,154,.45), 0 10px 30px rgba(0,0,0,.4); }
  .theme-neon .lab { box-shadow: 0 0 0 2px rgba(44,246,255,.7), 0 0 24px rgba(255,61,242,.45); }
  .theme-neon #cap span.on, .theme-neon .ttl { text-shadow: var(--glow); }
  .theme-news #cap .box { border-radius: 4px; padding: 6px 30px 2px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .theme-news .lab { border-radius: 4px; }
  .theme-news .lab i { color: #fff; }
  svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg id="lines"></svg>
<div id="ui"></div>
<div id="cap"></div>
<script type="module" src="film.js"></script>
</body>
</html>
