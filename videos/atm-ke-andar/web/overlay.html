<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>ATM overlay</title>
<style>
  @font-face { font-family: B; font-weight: 800; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-800-normal.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: B; font-weight: 800; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022, U+2192, U+2026; }
  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-devanagari-600-normal.woff2) format("woff2"); unicode-range: U+0900-097F, U+1CD0-1CFF, U+200C-200D, U+20B9, U+25CC, U+A8E0-A8FF; }
  @font-face { font-family: B; font-weight: 600; src: url(/node_modules/@fontsource/baloo-2/files/baloo-2-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2022, U+2192, U+2026; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; font-family: B, sans-serif; color: #fff; }
  #cap { position: absolute; left: 60px; right: 60px; top: 1360px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.25;
    text-shadow: 0 4px 0 rgba(0,0,0,.7), 0 0 22px rgba(0,0,0,.75); }
  #cap .box { display: inline; padding: 6px 22px 2px; border-radius: 16px; background: rgba(8,12,18,.5); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #cap span.on { color: #ffd166; }
  svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .lab { position: absolute; padding: 6px 22px 4px; border-radius: 16px; background: rgba(10,14,20,.86); box-shadow: 0 0 0 2px rgba(255,255,255,.25); white-space: nowrap; }
  .lab b { display: block; font-weight: 800; font-size: 48px; color: #ffd166; line-height: 1.2; }
  .lab i { display: block; font-style: normal; font-weight: 600; font-size: 32px; color: #dfe6ee; line-height: 1.2; }
  .chip { position: absolute; left: 50%; transform: translateX(-50%); top: 250px; padding: 10px 34px 6px; border-radius: 22px; font-weight: 800; font-size: 54px;
    white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; line-height: 1.15;
    text-shadow: 0 5px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.65); }
  #title small { display: block; font-size: 44px; font-weight: 600; color: #ffe1a1; margin-top: 18px; }
  .code { font-family: B, monospace; letter-spacing: 6px; }
</style>
</head>
<body>
<svg id="lines"></svg>
<div id="labs"></div>
<div id="chips"></div>
<div id="title"></div>
<div id="cap"></div>
<script type="module">
const D = await (await fetch('/out/overlay.json')).json();
const CAPS = await (await fetch('/out/captions.json')).json();
const FPS = D.fps;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const win = (t, a, b, f) => ss((t - a) / f) * (1 - ss((t - (b - f)) / f));
const CHIP = { ok: ['#1f9d55', '#fff'], warn: ['#d32f2f', '#fff'], count: ['#ffd166', '#1b1b1b'], fake: ['#d32f2f', '#fff'], ok2: ['rgba(10,14,20,.86)', '#9fd3ff'] };
const GLY = 'ABCDEF0123456789#@%&*Q';
function scramble(t) { let s = ''; for (let i = 0; i < 8; i++) s += GLY[Math.floor(Math.abs(Math.sin((Math.floor(t * 12) + 1) * (i + 3) * 12.9898)) * 43758.5453) % GLY.length]; return s; }

function renderAt(f) {
  const d = D.frames[Math.min(f, D.frames.length - 1)];
  const t = f / FPS;
  const c = CAPS.find((c) => t >= c.t0 && t < c.t1);
  const cap = $('cap');
  if (c && t < 36.6) {
    cap.innerHTML = '<span class="box">' + c.words.map((w, i) => {
      const on = t >= w.t - 0.03 && (i === c.words.length - 1 || t < c.words[i + 1].t - 0.03);
      return `<span class="${on ? 'on' : ''}">${w.w}</span>`;
    }).join(' ') + '</span>';
    cap.style.opacity = Math.min(1, (t - c.t0) / 0.06, (c.t1 - t) / 0.06);
  } else cap.innerHTML = '';
  let svg = '', html = '';
  for (const L of d.labels) {
    const w = 60 + Math.max(L.text.length * 30, L.sub ? L.sub.length * 18 : 0), dx = L.side === 'left' ? -130 - w : 130, dy = -150;
    const bx = clamp(L.x + dx, 40, 1040 - w), by = clamp(L.y + dy - 40, 380, 1200);
    const ex = L.side === 'left' ? bx + w : bx, ey = by + 44;
    svg += `<g opacity="${L.a}"><line x1="${L.x}" y1="${L.y}" x2="${ex}" y2="${ey}" stroke="#fff" stroke-width="4"/>` +
           `<circle cx="${L.x}" cy="${L.y}" r="12" fill="none" stroke="#ffd166" stroke-width="5"/><circle cx="${L.x}" cy="${L.y}" r="4" fill="#fff"/></g>`;
    html += `<div class="lab" style="left:${bx}px;top:${by}px;opacity:${L.a}"><b>${L.text}</b>${L.sub ? `<i>${L.sub}</i>` : ''}</div>`;
  }
  $('lines').innerHTML = svg; $('labs').innerHTML = html;
  const chips = d.chips.map((c) => { const [bg, fg] = CHIP[c.id]; return `<div class="chip" style="background:${bg};color:${fg};opacity:${c.a}">${c.text}</div>`; });
  // PIN -> secret code
  const pa = win(t, 10.35, 11.9, 0.2);
  if (pa > 0) chips.push(`<div class="chip" style="background:rgba(10,14,20,.88);color:#fff;opacity:${pa}">PIN •••• → <span class="code" style="color:#59d6ff">${scramble(t)}</span></div>`);
  $('chips').innerHTML = chips.join('');
  const ti = $('title');
  if (t < 3.7) {
    ti.style.top = '210px'; ti.style.opacity = ss((t - 0.1) / 0.3) * (1 - ss((t - 3.4) / 0.3)); ti.style.fontSize = '92px';
    ti.innerHTML = 'ATM के अंदर<br>क्या होता है?';
  } else if (t > 36.6) {
    ti.style.top = '560px'; ti.style.opacity = ss((t - 36.6) / 0.5); ti.style.fontSize = '104px';
    ti.innerHTML = '<span style="display:inline-block;padding:20px 50px 24px;border-radius:30px;background:rgba(8,12,18,.62)">ATM के अंदर<br>का सफ़र<small>कार्ड → PIN → बैंक → तिजोरी → नोट</small></span>';
  } else { ti.style.opacity = 0; ti.innerHTML = ''; }
}
window.__renderAt = renderAt;
window.__frames = D.frames.length;
await document.fonts.ready;
renderAt(0);
window.__ready = true;
</script>
</body>
</html>
